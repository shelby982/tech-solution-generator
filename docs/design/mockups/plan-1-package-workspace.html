<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方案 1 · 标包工作台 — 原型</title>
<style>
  :root{
    --bg:#f6f8fb; --panel:#fff; --line:#e2e8f0; --line2:#eef2f7;
    --text:#0f172a; --muted:#64748b; --accent:#2563eb; --accent-soft:#eff6ff;
    --ok:#16a34a; --ok-soft:#ecfdf5; --warn:#d97706; --warn-soft:#fffbeb; --bad:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:13px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",Inter,Roboto,sans-serif}
  a{color:inherit}
  /* 顶部 */
  .topbar{height:52px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line2)}
  .topbar .title{font-size:16px;font-weight:600}
  .topbar .sp{flex:1}
  .topbar .act{color:var(--muted);font-size:12.5px}
  .pill-model{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px}
  /* 标包切换器（本方案的主角） */
  .pkgbar{background:#fff;border-bottom:1px solid var(--line2);padding:10px 20px 8px}
  .pkgtabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pkgtab{
    display:flex;align-items:center;gap:8px;font:inherit;font-size:12.5px;padding:6px 13px;
    border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer;
  }
  .pkgtab:hover{border-color:#bfdbfe}
  .pkgtab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .pkgtab .n{font-size:11px;opacity:.8}
  .pkgtab.add{border-style:dashed;color:var(--muted)}
  .pkgbar .note{margin-top:7px;font-size:11.5px;color:var(--muted)}
  /* 主体 */
  .layout{display:flex;min-height:calc(100vh - 52px - 84px)}
  .rail{width:170px;flex:none;background:#fff;border-right:1px solid var(--line2);padding:16px 0 16px 18px}
  .step{display:flex;gap:10px;padding:9px 0;position:relative;cursor:pointer}
  .step .dot{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:#fff;
    color:var(--muted);font-size:11.5px;display:flex;align-items:center;justify-content:center}
  .step.on .dot{border-color:var(--accent);background:var(--accent);color:#fff}
  .step .lab{font-size:13px;font-weight:600}
  .step.on .lab{color:var(--accent)}
  .step .sub{font-size:11.5px;color:var(--muted)}
  .step:not(:last-child)::after{content:"";position:absolute;left:10.5px;top:31px;width:1px;height:calc(100% - 20px);background:var(--line)}
  .main{flex:1;min-width:0;padding:14px 20px 40px}
  .ctx{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ctx .name{font-size:14px;font-weight:600}
  .ctx .meta{font-size:12px;color:var(--muted)}
  .badge-ind{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:1px solid #bfdbfe}
  /* 本标包文件 */
  .files{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;margin-bottom:12px;flex-wrap:wrap}
  .files .k{font-size:12px;color:var(--muted)}
  .fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border:1px solid var(--line);
    border-radius:8px;background:#f8fafc}
  .fchip .ext{font-size:10px;font-weight:700;color:#2563eb}
  .btn{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.ghost{border-style:dashed;color:var(--muted)}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 4px;font-size:14px}
  .card .hint{font-size:12px;color:var(--muted);margin-bottom:12px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2)}
  .row:first-of-type{border-top:0}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f1f5f9;color:#475569;border:1px solid var(--line);white-space:nowrap}
  .tag.c{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
  .tag.t{background:#ecfeff;color:#0891b2;border-color:#a5f3fc}
  .num{font-variant-numeric:tabular-nums}
  .switchhint{background:var(--accent-soft);border:1px solid #bfdbfe;color:#1d4ed8;border-radius:10px;
    padding:9px 12px;font-size:12.5px;margin-bottom:12px}
  .planlinks{margin-left:auto;display:flex;gap:6px}
  .planlinks a{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted)}
  .planlinks a.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
</style>
</head>
<body>
  <div class="topbar">
    <span class="title">应标文件生成</span>
    <span style="font-size:12.5px;color:var(--muted)">XX市政交通项目</span>
    <span class="sp"></span>
    <span class="act">处理待办</span><span class="act">版本记录</span><span class="act">运行详情</span>
    <span class="pill-model">● deepseek-v4-pro ⌄</span>
    <span class="planlinks">
      <a class="on" href="#">方案 1</a>
      <a href="plan-2-intake-matrix.html">方案 2</a>
      <a href="plan-3-document-derived.html">方案 3</a>
    </span>
  </div>

  <!-- ── 标包切换器：本方案的核心 ───────────────────────────────── -->
  <div class="pkgbar">
    <div class="pkgtabs" id="pkgtabs"></div>
    <div class="note">每个标包是独立的一份应答：<b>文件、评分点、目录、正文、评审都只属于它</b>。切换标包 = 换一整套工作区。</div>
  </div>

  <div class="layout">
    <aside class="rail" id="rail">
      <div class="step on" data-step="1"><span class="dot">1</span><span><span class="lab">评分点</span><div class="sub">拆商务/技术</div></span></div>
      <div class="step" data-step="2"><span class="dot">2</span><span><span class="lab">待确认</span><div class="sub">规范书 · 目录</div></span></div>
      <div class="step" data-step="3"><span class="dot">3</span><span><span class="lab">产物</span><div class="sub">目录 · 映射</div></span></div>
      <div class="step" data-step="4"><span class="dot">4</span><span><span class="lab">编写</span><div class="sub">按章写作</div></span></div>
      <div class="step" data-step="5"><span class="dot">5</span><span><span class="lab">评审</span><div class="sub">按评分点把关</div></span></div>
    </aside>

    <main class="main">
      <div class="ctx">
        <span class="name" id="ctxName">—</span>
        <span class="badge-ind">独立内容</span>
        <span class="meta" id="ctxMeta"></span>
      </div>

      <div class="switchhint" id="switchHint">切换上方标包试试：文件、评分点、进度会<b>整体换掉</b>。</div>

      <div class="files">
        <span class="k">本标包文件</span>
        <span id="fileChips"></span>
        <span style="flex:1"></span>
        <button class="btn ghost">＋ 添加文件</button>
      </div>

      <div class="card">
        <h3 id="paneTitle">评分点</h3>
        <div class="hint" id="paneHint"></div>
        <div id="paneBody"></div>
      </div>
    </main>
  </div>

<script>
// 三个标包 —— 演示"每个标包内容互相独立"
const PACKAGES = {
  'p1': {
    tab: '标的1 / 标包2', full: '标的1 / 标包2 · 高可靠技术专题研究与验证标包',
    files: [['PDF', '1_2026年南网数字运营软件…招标文件.pdf'], ['DOCX', '技术规范书-智慧交通分册.docx']],
    meta: '商务评分点 8 · 技术评分点 8 · 技术规范书 1 份 · 正文 12/38 章',
    points: [
      ['商务', '商务投标文件质量', '投标文件章节内容准确对应格式要求', '5 分'],
      ['技术', '系统架构', '高可靠容灾研究与验证', '8 分'],
      ['技术', '性能指标', '低时延观测全链路埋点', '6 分'],
    ],
  },
  'p2': {
    tab: '标的1 / 标包3', full: '标的1 / 标包3 · 云资源池及网络架构',
    files: [['PDF', '2_标的1标包3_招标文件.pdf']],
    meta: '商务评分点 0 · 技术评分点 9 · 技术规范书 1 份 · 正文 —',
    points: [
      ['技术', '网络架构', '云资源池组网方案', '9 分'],
      ['技术', '安全', '边界安全与等保要求', '7 分'],
      ['⚠ 缺项', '商务评分点', '本标包还没拆出商务评分点', '—'],
    ],
  },
  'p3': {
    tab: '标的2 / 标包1', full: '标的2 / 标包1 · 客户档案管理认证',
    files: [['PDF', '3_标的2标包1_招标文件.pdf']],
    meta: '评分点 待拆 · 技术规范书 0 份 · 正文 —',
    points: [['—', '尚未拆分', '先确认本标包，再拆商务/技术评分点', '—']],
  },
};
let cur = 'p1';

function renderTabs() {
  document.getElementById('pkgtabs').innerHTML =
    Object.entries(PACKAGES).map(([id, p]) =>
      `<button class="pkgtab${id === cur ? ' on' : ''}" data-pkg="${id}">${p.tab}<span class="n">›</span></button>`
    ).join('') + `<button class="pkgtab add">＋ 新建标包</button>`;
  document.querySelectorAll('.pkgtab[data-pkg]').forEach((b) =>
    b.addEventListener('click', () => { cur = b.dataset.pkg; renderAll(); }));
}
function renderAll() {
  const p = PACKAGES[cur];
  renderTabs();
  document.getElementById('ctxName').textContent = p.full;
  document.getElementById('ctxMeta').textContent = p.meta;
  document.getElementById('fileChips').innerHTML = p.files.map(([ext, name]) =>
    `<span class="fchip"><span class="ext">${ext}</span>${name}</span>`).join('');
  document.getElementById('paneTitle').textContent = '评分点';
  document.getElementById('paneHint').textContent =
    `以下评分点只属于「${p.tab}」；切到别的标包看到的是另一套。`;
  document.getElementById('paneBody').innerHTML = p.points.map(([cat, factor, item, score]) => {
    const cls = cat === '商务' ? 'c' : (cat === '技术' ? 't' : '');
    return `<div class="row"><span class="tag ${cls}">${cat}</span>
      <div style="flex:1"><b style="font-size:12.5px">${factor}</b>
        <div style="font-size:12px;color:var(--muted)">${item}</div></div>
      <span class="num" style="font-size:12.5px">${score}</span></div>`;
  }).join('');
  const p2 = PACKAGES[cur];
  const hint = document.getElementById('switchHint');
  hint.innerHTML = cur === 'p1'
    ? '切换上方标包试试：文件、评分点、进度会<b>整体换掉</b>。'
    : `当前是「${p2.tab}」—— 注意文件、评分点、进度都变了（这就是"每个标包独立"）。`;
}
// 左侧五步可点（仅演示高亮）
document.querySelectorAll('.step').forEach((s) => s.addEventListener('click', () => {
  document.querySelectorAll('.step').forEach((x) => x.classList.remove('on'));
  s.classList.add('on');
}));
renderAll();
</script>
</body>
</html>
