<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>倒着写 · 60s 竖版动态分镜 v2</title>
<!--
  《倒着写》60s 竖版动态分镜（v2）
  用法：video-animatic-v2.html?f=1 ... ?f=9
  1080 × 1920 · 实拍位 P1/P2/P3 先用占位卡，正式拍摄后替换
-->
<style>
  :root{
    --bg:#0A0F1A; --text:#F2F6FC; --muted:#93A4BC; --muted-2:#607089;
    --blue:#3B82F6; --paper:#F3EFE6;
    --font:"PingFang SC","HarmonyOS Sans","Noto Sans SC","Microsoft YaHei",Inter,system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}
  .frame{
    position:relative;width:1080px;height:1920px;display:flex;flex-direction:column;
    padding:150px 78px 0;
    background:
      radial-gradient(900px 560px at 80% -8%, rgba(37,99,235,.20), transparent 60%),
      linear-gradient(180deg,#0A0F1A 0%,#0C1526 60%,#0A0F1A 100%);
  }
  .frame::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:72px 72px;
    mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.35) 60%,transparent 95%);
    -webkit-mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.35) 60%,transparent 95%);
  }
  .content{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:54px;padding-bottom:40px}

  .line{font-size:66px;font-weight:600;line-height:1.32;letter-spacing:-.015em;text-align:center;max-width:13em}
  .line em{font-style:normal;background:linear-gradient(180deg,transparent 74%,rgba(37,99,235,.6) 74%);padding:0 .05em}
  .line.small{font-size:44px;color:#C6D4E6;font-weight:500}
  .toplabel{
    position:absolute;top:150px;left:78px;z-index:3;font-family:var(--mono);font-size:16px;
    letter-spacing:.12em;color:#6B7C96;
  }
  .toplabel b{color:#FCD34D;font-weight:500}

  /* 实拍占位 */
  .plate{
    width:100%;border-radius:22px;border:1px solid rgba(255,255,255,.12);
    background:linear-gradient(180deg,#101A2B,#0C1422);
    box-shadow:0 40px 90px rgba(0,0,0,.5);padding:56px;position:relative;overflow:hidden;
  }
  .plate .tag{
    position:absolute;top:22px;left:24px;font-family:var(--mono);font-size:14px;letter-spacing:.1em;
    color:#FCD34D;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.32);
    border-radius:6px;padding:5px 10px;
  }
  .stack{position:relative;height:430px}
  .stack i{
    position:absolute;left:50%;transform:translateX(-50%) rotate(var(--r));width:74%;height:96%;
    background:linear-gradient(180deg,#FDFBF6,#EDE7DA);border-radius:6px;display:block;
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.04);
  }
  .stack i:nth-child(1){--r:-4deg;top:26px;opacity:.55}
  .stack i:nth-child(2){--r:2.5deg;top:16px;opacity:.8}
  .stack i:nth-child(3){--r:-1deg;top:0}
  .stack i:nth-child(3)::after{
    content:"";position:absolute;inset:34px 38px auto;height:10px;background:#C9C2B4;border-radius:3px;
    box-shadow:0 30px 0 #DDD6C8, 0 60px 0 #E4DDCF, 0 90px 0 #DDD6C8, 0 120px 0 #E4DDCF, 0 150px 0 #DDD6C8;
  }
  .redline{
    position:absolute;left:50%;top:46%;width:62%;height:3px;background:#D43B2F;border-radius:2px;
    transform:translateX(-50%) rotate(-1.2deg);box-shadow:0 0 0 1px rgba(212,59,47,.15);
  }
  .sheet{
    position:relative;background:#FBF8F1;border-radius:6px;padding:44px 40px;color:#2A2A2A;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  .sheet .h{height:18px;width:42%;background:#B9B2A4;border-radius:4px;margin-bottom:26px}
  .sheet .r{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #E4DED0}
  .sheet .r span{height:11px;background:#D8D2C4;border-radius:3px;display:block}
  .sheet .r b{font-size:20px;color:#3A3A3A;font-weight:600}
  .sheet .r.hit b{color:#C8372B}
  .sheet .r.hit{background:rgba(212,59,47,.06)}
  .mark{position:absolute;right:26px;font-size:46px;font-weight:700;color:#C8372B;opacity:.9}

  /* 产品截图 */
  .shot-card{width:100%;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:#0E1727;box-shadow:0 40px 90px rgba(0,0,0,.55)}
  .shot-card img{width:100%;display:block}

  /* 收尾 */
  .claim{font-size:88px;font-weight:600;line-height:1.3;letter-spacing:-.02em;text-align:center}
  .brand{display:flex;align-items:center;gap:16px;font-size:28px;color:#C7D2E0}
  .mark-logo{width:54px;height:54px;border-radius:14px;background:linear-gradient(160deg,#3B82F6,#1D4ED8);display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff}
  .flip{
    display:inline-block;font-size:120px;font-weight:700;color:rgba(59,130,246,.18);
    transform:rotate(180deg);line-height:1;
  }

  /* 字幕 */
  .subs{
    position:absolute;left:0;right:0;bottom:0;z-index:3;padding:120px 78px 170px;
    background:linear-gradient(180deg,transparent,rgba(3,7,16,.86) 55%,rgba(3,7,16,.96));
    text-align:center;font-size:34px;font-weight:600;line-height:1.5;color:#fff;
    text-shadow:0 3px 14px rgba(0,0,0,.6);
  }
  .subs small{display:block;margin-top:10px;font-size:20px;font-weight:400;color:#9FB3CB}

  .type{justify-content:center;padding-top:0}
  .type .content{justify-content:center;gap:46px}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
const SHOTS = [
 {no:"P1", type:"plate", kind:"stack",
  label:'实拍 P1 · 标书翻页',
  headline:'标书，<br />都是从头写到尾。',
  subtitle:'标书，都是从头写到尾。'},

 {no:"P2", type:"plate", kind:"sheet",
  label:'实拍 P2 · 评分表红笔',
  headline:'评委，<br />是从评分表开始看的。',
  subtitle:'评委，是从评分表开始看的。'},

 {no:"03", type:"img", img:"assets/live-outline.png",
  headline:'所以，倒着来。',
  subtitle:'所以，智能应标让你倒着写。'},

 {no:"04", type:"img", img:"assets/plan.png",
  headline:'先定每一分在哪一章，<br />再定每章写什么。',
  subtitle:'先把每一分落到章节，再决定每章写什么、写多少字。'},

 {no:"05", type:"img", img:"assets/editor.png",
  headline:'四个角色按计划写，<br />每处引用都能回到原文。',
  subtitle:'四个角色按计划落稿；每一处引用，都能回到原文。'},

 {no:"06", type:"img", img:"assets/todo.png",
  headline:'缺的材料和口径留给你，<br />其余系统做。',
  subtitle:'缺的材料、要定的口径留给你；检索、核对、重写，系统自己做。'},

 {no:"07", type:"img", img:"assets/review.png",
  headline:'哪一分没拿到，<br />一眼看见。',
  subtitle:'写完按评分点验收：哪一分没拿到，哪一节要补，一眼看见。'},

 {no:"P3", type:"plate", kind:"word",
  label:'实拍 P3 · 合上标书',
  headline:'然后，交付。',
  subtitle:'然后，导出 Word，交付。'},

 {no:"09", type:"type",
  claim:'每一分，<br />都有出处。',
  subtitle:'智能应标。每一分，都有出处。'}
];

function plate(kind){
  if(kind==='stack') return `<div class="plate"><span class="tag">实拍占位 · 待拍摄替换</span><div class="stack"><i></i><i></i><i></i></div></div>`;
  if(kind==='sheet') return `<div class="plate"><span class="tag">实拍占位 · 待拍摄替换</span>
    <div class="sheet"><div class="h"></div>
      <div class="r"><span style="width:46%"></span><b>5 分</b></div>
      <div class="r hit"><span style="width:58%"></span><b>8 分</b></div>
      <div class="r"><span style="width:38%"></span><b>10 分</b></div>
      <div class="r hit"><span style="width:52%"></span><b>6 分</b></div>
      <div class="r"><span style="width:44%"></span><b>5 分</b></div>
    </div><div class="redline"></div><span class="mark">✗</span></div>`;
  return `<div class="plate"><span class="tag">实拍占位 · 待拍摄替换</span>
    <div class="sheet" style="padding:52px 48px">
      <div class="h" style="width:34%"></div>
      <div style="height:12px;background:#DDD6C8;border-radius:3px;margin-bottom:14px"></div>
      <div style="height:12px;background:#E4DDCF;border-radius:3px;margin-bottom:14px;width:86%"></div>
      <div style="height:12px;background:#DDD6C8;border-radius:3px;margin-bottom:34px;width:72%"></div>
      <div style="font-family:var(--mono);font-size:22px;color:#7A7365">技术应答.docx</div>
    </div></div>`;
}

function render(n){
  const s = SHOTS[n-1]; if(!s) return;
  const f = document.getElementById('frame');
  let html = '';
  if (s.type === 'type') {
    f.classList.add('type');
    html = `<div class="content">
      <div class="flip">倒</div>
      <div class="claim">${s.claim}</div>
      <div class="brand"><span class="mark-logo">应</span> 智能应标</div>
    </div><div class="subs">${s.subtitle}</div>`;
  } else if (s.type === 'plate') {
    html = `<div class="toplabel">${s.label.includes('实拍')?'<b>实拍位</b>':'SHOT '+s.no} · ${s.label}</div>
      <div class="content">${plate(s.kind)}<div class="line">${s.headline}</div></div>
      <div class="subs">${s.subtitle}</div>`;
  } else {
    html = `<div class="toplabel">SHOT ${s.no} / 09</div>
      <div class="content">
        <div class="line" style="font-size:54px">${s.headline}</div>
        <div class="shot-card"><img src="${s.img}" alt="" /></div>
      </div>
      <div class="subs">${s.subtitle}</div>`;
  }
  f.innerHTML = html;
}
const n = parseInt(new URLSearchParams(location.search).get('f') || '1', 10);
render(n);
document.title = 'SHOT ' + n;
</script>
</body>
</html>
