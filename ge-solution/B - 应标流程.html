<div id="root"></div>
<script type="text/babel">
// tweaks-panel.jsx (inlined)

    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");

    width:14px;height:14px;border-radius:50%;background:#fff;
    border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}

  .twk-num-lbl{font-weight:500;color:rgba(41,38,27,.6);cursor:ew-resize;
    user-select:none;padding-right:8px}
  .twk-num input{flex:1;min-width:0;height:100%;border:0;background:transparent;
    font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:0 8px 0 0;

  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

  .twk-swatch::-webkit-color-swatch{border:0;border-radius:5.5px}
  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}

    padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;
    box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
    transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);
    box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),
    0 2px 6px rgba(0,0,0,.15)}
  .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;
    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}
  .twk-chip>span>i{flex:1;box-shadow:0 -1px 0 rgba(0,0,0,.1)}
  .twk-chip>span>i:first-child{box-shadow:none}

    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

            </div>
            <textarea
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              placeholder={phase === "extracting" ? "提炼中···" : "对大纲提出修改建议，例如：将第二章的「项目实施与交付」拆分为两节…"}
              rows={1}
              style={{
                all: "unset", boxSizing: "border-box",
                flex: 1, fontSize: 13, color: "var(--ink)",
                fontFamily: "inherit", lineHeight: 1.6,
                resize: "none", maxHeight: 120,
                paddingTop: 3,
              }}
            />
            <button disabled={!draft.trim()} style={{
              all: "unset", boxSizing: "border-box",
              cursor: draft.trim() ? "pointer" : "not-allowed",
              display: "inline-grid", placeItems: "center",
              width: 32, height: 32, borderRadius: 8,
              background: draft.trim() ? "var(--ink)" : "#dcdbd6",
              color: "#fff", flex: "none",
            }} title="发送">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7L12 7M7 2L12 7L7 12" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
          </div>
          <div style={{
            display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap",
          }}>
            {["让大纲更精简", "合并相似章节", "补全空白要求", "调整章节顺序"].map((q) => (
              <button key={q} style={{
                all: "unset", cursor: "pointer", boxSizing: "border-box",
                padding: "4px 10px", borderRadius: 999,
                border: "1px solid var(--line)",
                background: "var(--surface)",
                fontSize: 11.5, color: "var(--ink-3)",
              }}>{q}</button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  function ProgressInline({ progress, stage, modelName, onCancel }) {
    return (
      <div style={{
        display: "flex", flexDirection: "column", gap: 8,
        maxWidth: 560,
      }}>
        <div style={{
          display: "flex", alignItems: "center", gap: 10,
          fontSize: 12.5,
        }}>
          <span style={{
            width: 14, height: 14, borderRadius: "50%",
            border: "2px solid var(--line)",
            borderTopColor: "var(--accent)",
            animation: "spin 0.85s linear infinite",
            flex: "none",
          }} />
          <span style={{ fontWeight: 600, color: "var(--ink)" }}>正在提炼</span>
          <span style={{ color: "var(--ink-4)" }}>·</span>
          <span style={{
            color: "var(--ink-3)",
            animation: "pulse 1.6s ease-in-out infinite",
          }}>{stage}</span>
          <span style={{ flex: 1 }} />
          <span style={{
            fontFamily: "SF Mono, ui-monospace, monospace",
            fontSize: 12, fontWeight: 700,
            color: "var(--ink)",
            fontVariantNumeric: "tabular-nums",
          }}>{Math.round(progress)}%</span>
          <button onClick={onCancel} title="取消提炼" style={{
            all: "unset", cursor: "pointer", boxSizing: "border-box",
            display: "inline-flex", alignItems: "center", gap: 5,
            padding: "4px 9px", borderRadius: 6,
            border: "1px solid var(--line)",
            background: "var(--surface)",
            fontSize: 11.5, color: "var(--ink-2)",
          }}>
            <svg width="9" height="9" viewBox="0 0 9 9"><path d="M1.5 1.5L7.5 7.5M7.5 1.5L1.5 7.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
            取消
          </button>
        </div>
        <div style={{
          height: 6, borderRadius: 999,
          background: "#ececea",
          overflow: "hidden",
          position: "relative",
        }}>
          <div style={{
            width: `${progress}%`,
            height: "100%",
            backgroundImage: "linear-gradient(45deg, rgba(255,255,255,0.22) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.22) 75%, transparent 75%, transparent), linear-gradient(90deg, var(--accent), oklch(0.65 0.16 256))",
            backgroundSize: "20px 20px, 100% 100%",
            animation: "pbStripes 1.1s linear infinite",
            transition: "width 0.35s ease-out",
            borderRadius: 999,
          }} />
        </div>
        <div style={{
          display: "flex", justifyContent: "space-between",
          fontSize: 11, color: "var(--ink-4)",
        }}>
          <span>使用模型：{modelName || "Sonnet 4.6"}</span>
          <span>预计剩余 ~{Math.max(2, Math.round((100 - progress) / 6))}s</span>
        </div>
      </div>
    );
  }

  function CanceledInline({ onRetry, progress }) {
    return (
      <div style={{
        display: "flex", alignItems: "center", gap: 10,
        fontSize: 12.5, maxWidth: 560, flexWrap: "wrap",
      }}>
        <span style={{
          width: 16, height: 16, borderRadius: "50%",
          background: "var(--surface)", border: "1px solid var(--line)",
          display: "inline-grid", placeItems: "center",
          color: "var(--ink-3)", flex: "none",
        }}>
          <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1.5 1.5L6.5 6.5M6.5 1.5L1.5 6.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
        </span>
        <span style={{ fontWeight: 600, color: "var(--ink-2)" }}>提炼已取消</span>
        <span style={{ color: "var(--ink-4)" }}>·</span>
        <span style={{ color: "var(--ink-3)" }}>中断于 {Math.round(progress) || 0}%</span>
        <span style={{ flex: 1 }} />
        <button onClick={onRetry} style={{
          all: "unset", cursor: "pointer", boxSizing: "border-box",
          display: "inline-flex", alignItems: "center", gap: 5,
          padding: "5px 11px", borderRadius: 6,
          background: "var(--ink)", color: "#fff",
          fontSize: 11.5, fontWeight: 600,
        }}>
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M8.5 1.5V4H6 M1.5 8.5V6H4 M8 6C7.5 7.5 6 8.5 4.5 8.5C3 8.5 1.8 7.6 1.5 6.5 M2 4C2.5 2.5 4 1.5 5.5 1.5C7 1.5 8.2 2.4 8.5 3.5" stroke="currentColor" strokeWidth="1.2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          重试提炼
        </button>
      </div>
    );
  }

  // ── workspace (right pane) ─────────────────────────────────────────
  function Workspace({ state, outlinePhase, setOutlinePhase, modelName }) {
    return (
      <main style={{
        flex: 1, height: "100%", overflow: "auto",
        background: "var(--surface-2)",
        display: "flex", flexDirection: "column",
      }}>
        <div style={{
          padding: "14px 28px",
          borderBottom: "1px solid var(--line)",
          background: "var(--surface)",
          display: "flex", alignItems: "center", gap: 12,
        }}>
          <div style={{ fontSize: 13, color: "var(--ink-3)" }}>未命名应标 / </div>
          <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink)" }}>大纲编辑</div>
          <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
            <button style={{
              all: "unset", cursor: "pointer", padding: "6px 12px",
              border: "1px solid var(--line)", borderRadius: 8,
              fontSize: 12.5, color: "var(--ink-2)", background: "var(--surface)",
            }}>预览</button>
            <button style={{
              all: "unset", cursor: "pointer", padding: "6px 12px",
              border: "1px solid var(--line)", borderRadius: 8,
              fontSize: 12.5, color: "var(--ink-2)", background: "var(--surface)",
            }}>导出</button>
          </div>
        </div>

        <div style={{
          flex: 1, padding: state === "full" ? "0" : "60px 80px",
          display: "flex", flexDirection: "column",
          alignItems: state === "full" ? "stretch" : "center",
          justifyContent: state === "empty" ? "center" : "flex-start",
          gap: state === "full" ? 0 : 16,
          overflow: "auto",
        }}>
          {state === "empty" && (
            <>
              <div style={{
                width: 64, height: 64, borderRadius: 16,
                background: "var(--surface)", border: "1px solid var(--line)",
                display: "grid", placeItems: "center",
                color: "var(--ink-4)",
              }}>
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                  <path d="M6 9h16M6 14h16M6 19h10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                </svg>
              </div>
              <div style={{ fontSize: 16, fontWeight: 600, color: "var(--ink-2)" }}>大纲尚未生成</div>
              <div style={{
                fontSize: 13, color: "var(--ink-3)", maxWidth: 360, textAlign: "center", lineHeight: 1.7,
              }}>
                从左侧添加应标要求开始。原始素材将用于为每个章节自动填充内容。
              </div>
            </>
          )}
          {state === "partial" && (
            <>
              <div style={{
                fontSize: 12, color: "var(--accent-ink)",
                fontFamily: "SF Mono, ui-monospace, monospace", letterSpacing: 1,
                padding: "4px 10px", borderRadius: 999,
                background: "var(--accent-soft)", border: "1px solid var(--accent-soft-border)",
              }}>已就绪 · 可提炼大纲</div>
              <div style={{ fontSize: 16, fontWeight: 600, color: "var(--ink-2)", marginTop: 8 }}>
                添加原始素材以丰富内容
              </div>
              <div style={{
                fontSize: 13, color: "var(--ink-3)", maxWidth: 380, textAlign: "center", lineHeight: 1.7,
              }}>
                你可以直接提炼大纲生成空白章节，或先上传原始素材让 AI 在每个模块下自动填充。
              </div>
            </>
          )}
          {state === "full" && (
            <OutlineDoc phase={outlinePhase} setPhase={setOutlinePhase} modelName={modelName} />
          )}
        </div>
      </main>
    );
  }

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [apiModalOpen, setApiModalOpen] = React.useState(false);
    const [selectedModel, setSelectedModel] = React.useState("sonnet-4.6");
    const modelName = (MODELS.find((m) => m.id === selectedModel) || MODELS[1]).name;
    const setOutlinePhase = React.useCallback((v) => setTweak("outlinePhase", v), [setTweak]);
    return (
      <div style={{ display: "flex", width: "100%", height: "100%" }}>
        <Sidebar t={t} setTweak={setTweak}
          onOpenAPIConfig={() => setApiModalOpen(true)}
          selectedModel={selectedModel} setSelectedModel={setSelectedModel} />
        <Workspace state={t.state}
          outlinePhase={t.outlinePhase || "done"}
          setOutlinePhase={setOutlinePhase}
          modelName={modelName} />
        <APIConfigModal open={apiModalOpen} onClose={() => setApiModalOpen(false)} accent={t.accent} />
        <TweaksPanel title="Tweaks">
          <TweakSection label="状态预览">
            <TweakRadio
              label="文件上传状态"
              value={t.state}
              onChange={(v) => setTweak("state", v)}
              options={[
                { value: "empty", label: "空" },
                { value: "partial", label: "已上传应标" },
                { value: "full", label: "全部上传" },
              ]}
            />
            <TweakRadio
              label="提炼阶段"
              value={t.outlinePhase || "done"}
              onChange={(v) => setTweak("outlinePhase", v)}
              options={[
                { value: "extracting", label: "提炼中" },
                { value: "canceled", label: "已取消" },
                { value: "done", label: "已完成" },
              ]}
            />
          </TweakSection>
          <TweakSection label="视觉微调">
            <TweakColor
              label="主操作色"
              value={t.accent}
              onChange={(v) => setTweak("accent", v)}
              options={["#3461db", "#181818", "#0f7a5b", "#a64bd1", "#c84a2a"]}
            />
            <TweakToggle
              label="空状态显示大投放区"
              value={t.showDropzoneEmpty}
              onChange={(v) => setTweak("showDropzoneEmpty", v)}
            />
            <TweakToggle
              label="紧凑文件行"
              value={t.compactFiles}
              onChange={(v) => setTweak("compactFiles", v)}
            />
          </TweakSection>
        </TweaksPanel>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
