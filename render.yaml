services:
  - type: web
    name: tech-solution-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: CONFIG_PATH
        value: /data
      - key: PORT
        value: 8000
      - key: SAAS_MODE
        value: "1"
      - key: SAAS_TRIAL_DAYS
        value: "14"
      - key: SAAS_SESSION_DAYS
        value: "30"
    disk:
      name: config-data
      mountPath: /data
      sizeGB: 1
