<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiBidding · Workbench Init State</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <style>
/* ── 三栏布局 ── */
.init-layout {
  display: flex;
  height: calc(100vh - 48px);
  overflow: hidden;
}

/* 左侧面板 */
.init-materials-panel {
  width: 320px;
  flex: 0 0 320px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--panel);
  min-height: 0;
  overflow: hidden;
}
.materials-panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.app-logo-sm {
  width: 32px; height: 32px;
  background: var(--text);
  border-radius: 8px;
  display: grid; place-items: center;
  color: #fff; font-size: 13px; font-weight: 700;
  flex: none;
}
.app-title { font-size: 13px; font-weight: 700; }
.project-name-sm { font-size: 11.5px; color: var(--muted); }
.materials-project-name {
  padding: 12px 14px 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  border-bottom: 1px solid var(--line);
}
.materials-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.mat-section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 14px 10px;
}
.mat-section-top {
  padding: 0 0 10px;
}
.mat-section-header {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 3px;
}
.mat-index { font-size: 10px; color: var(--muted-2); font-weight: 700; }
.mat-count {
  margin-left: auto;
  font-size: 11px; color: var(--muted);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 9px;
}
.mat-sub { font-size: 11px; color: var(--muted); margin: 0; }
.mat-divider { display: none; }
.mat-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.mat-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
}
.mat-badge {
  font-size: 9.5px; font-weight: 700;
  padding: 2px 6px; border-radius: 5px;
  flex: none;
}
.mat-badge.docx { background: #dbeafe; color: #1d4ed8; }
.mat-badge.pdf  { background: #fee2e2; color: #dc2626; }
.mat-badge.ppt, .mat-badge.pptx { background: #ffedd5; color: #ea580c; }
.mat-name { flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mat-size { font-size: 11.5px; color: var(--muted); flex: none; }
.mat-del { background: none; border: none; cursor: pointer; color: var(--muted); padding: 0 2px; font-size: 15px; line-height: 1; }
.mat-del:hover { color: var(--text); }
.mat-add-row { padding: 0; display: flex; gap: 8px; align-items: stretch; }
.mat-role-badge {
  font-size: 10.5px;
  padding: 2px 7px;
  border-radius: 10px;
  flex: none;
  font-weight: 600;
}
.mat-role-badge.role-main_rfp,
.mat-role-badge.role-requirement { background: #dbeafe; color: #1e40af; }
.mat-role-badge.role-spec        { background: #ccfbf1; color: #115e59; }
.mat-role-badge.role-scoring     { background: #fef3c7; color: #92400e; }
.mat-role-badge.role-evaluation  { background: #ede9fe; color: #5b21b6; }
/* 已上传文件 role 下拉：与 mat-role-badge 同款配色，可点击修改 */
.mat-role-select {
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 10px;
  border: none;
  flex: none;
  font-weight: 600;
  cursor: pointer;
  outline: none;
}
.mat-role-select.role-main_rfp,
.mat-role-select.role-requirement { background: #dbeafe; color: #1e40af; }
.mat-role-select.role-spec        { background: #ccfbf1; color: #115e59; }
.mat-role-select.role-scoring     { background: #fef3c7; color: #92400e; }
.mat-role-select.role-evaluation  { background: #ede9fe; color: #5b21b6; }
.mat-role-select:hover { filter: brightness(0.95); }
.mat-parse-badge {
  font-size: 10.5px;
  padding: 2px 7px;
  border-radius: 10px;
  flex: none;
  font-weight: 600;
}
.mat-parse-badge.parsing { background: #fef3c7; color: #92400e; animation: pulse 1.4s ease-in-out infinite; }
.mat-parse-badge.failed  { background: #fee2e2; color: #b91c1c; }
.role-select {
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  flex: 0 0 auto;
}
.btn-add-mat {
  flex: 1;
  padding: 8px 12px;
  border: 1.5px dashed var(--line);
  border-radius: 10px;
  background: none;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  min-height: 38px;
}
.btn-add-mat:hover { border-color: var(--text); color: var(--text); }

/* 视图模式：素材匹配阶段隐藏应标要求模块（用户已点击「确认大纲」后） */
body[data-view="matching"] #mat-section-req { display: none; }
/* 解析大纲视图：隐藏原始素材模块（仅在素材匹配视图才需要看到素材） */
body[data-view="outline"] #mat-section-src { display: none; }

/* 底部操作区 */
.materials-footer {
  padding: 12px;
  border-top: 1px solid var(--line);
  background: #eff6ff;
  border-radius: 0 0 0 0;
}
.btn-extract {
  width: 100%;
  padding: 13px;
  background: var(--text);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 10px;
  letter-spacing: 0.02em;
}
.btn-extract:disabled { opacity: 0.5; cursor: not-allowed; }
.extract-hint { font-size: 11px; color: #2563eb; line-height: 1.5; margin: 6px 0 0; }
/* 模型选择器 */
.model-selector-wrap { position: relative; }
.model-selector-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  font: inherit; font-size: 12.5px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.model-selector-btn:hover { border-color: var(--muted); }
.model-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text); flex: none; }
.model-dropdown {
  display: none; position: absolute;
  top: calc(100% + 6px); right: 0;
  min-width: 200px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.1);
  overflow: hidden; z-index: 100;
}
.model-dropdown.open { display: block; }
.model-dropdown-header { padding: 10px 14px 6px; font-size: 11.5px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line); }
.model-list { padding: 6px; }
.model-option { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.model-option:hover { background: var(--bg-2); }
.model-option.selected { background: var(--accent-soft, #eff6ff); }
.model-option-check { color: var(--accent, #2563eb); font-size: 13px; }
.model-dropdown-footer { border-top: 1px solid var(--line); padding: 6px; }
.btn-add-config { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--muted); background: none; border: none; width: 100%; font: inherit; }
.btn-add-config:hover { background: var(--bg-2); }
.btn-add-config-left { display: flex; align-items: center; gap: 6px; }
.btn-add-config-plus { font-size: 16px; line-height: 1; }
.btn-add-config-api { font-size: 11.5px; color: var(--muted); }
/* API 配置弹窗 */
.api-modal-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(15,23,42,0.45); backdrop-filter: blur(4px);
  z-index: 200; align-items: center; justify-content: center;
}
.api-modal-backdrop.open { display: flex; }
.api-modal-box {
  background: var(--panel); border-radius: 20px;
  box-shadow: 0 30px 60px rgba(15,23,42,.22);
  width: 480px; max-width: calc(100vw - 48px); overflow: hidden;
}
.api-modal-header {
  padding: 18px 22px 14px; border-bottom: 1px solid var(--line);
  display: flex; align-items: flex-start; justify-content: space-between;
}
.api-modal-header h2 { margin: 0; font-size: 16px; font-weight: 700; }
.api-modal-header p  { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
.api-modal-close { all: unset; cursor: pointer; padding: 4px 6px; border-radius: 6px; color: var(--muted-2); font-size: 14px; }
.api-modal-close:hover { background: var(--bg-2); }
.api-modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.api-field-label { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.api-field-hint  { font-size: 11px; color: var(--muted-2); margin-top: 4px; }
.api-input {
  width: 100%; box-sizing: border-box; padding: 9px 11px;
  background: var(--panel-soft, #f8fafc); border: 1.5px solid var(--line);
  border-radius: 9px; font: inherit; font-size: 13px; color: var(--text); outline: none;
}
.api-input:focus { border-color: var(--accent, #2563eb); }
.api-input.mono { font-family: 'SF Mono', ui-monospace, monospace; font-size: 12.5px; }
.provider-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.provider-chip {
  padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--panel); cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 500; color: var(--muted);
}
.provider-chip.active { border-color: var(--accent, #2563eb); background: var(--accent-soft, #eff6ff); color: var(--accent, #2563eb); font-weight: 600; }
.key-wrap { position: relative; }
.key-toggle { all: unset; cursor: pointer; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted-2); padding: 3px 6px; border-radius: 4px; }
.key-toggle:hover { color: var(--text); background: var(--bg-2); }
.api-modal-footer {
  padding: 13px 22px; border-top: 1px solid var(--line);
  background: var(--panel-soft, #f8fafc);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.btn-test-conn {
  all: unset; cursor: pointer; padding: 8px 12px; border-radius: 8px;
  font: inherit; font-size: 12.5px; color: var(--muted);
  display: flex; align-items: center; gap: 5px;
  border: 1px solid var(--line); background: var(--panel);
}
.btn-test-conn:hover { border-color: var(--muted); color: var(--text); }
.btn-test-conn.testing { opacity: 0.6; pointer-events: none; }
.test-status { font-size: 12px; }
.test-status.ok   { color: #16a34a; }
.test-status.fail { color: #dc2626; }
.api-footer-right { display: flex; gap: 8px; }
.btn-api-cancel { padding: 9px 16px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
.btn-api-save { padding: 9px 16px; border-radius: 9px; border: none; background: var(--text); font: inherit; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; }
.btn-api-save:disabled { opacity: 0.45; cursor: default; }

/* 中间主区 */
.init-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-2);
}
.extract-status-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
  min-height: 48px;
}
.extract-status-bar[data-state="idle"] { display: none; }
.status-bar-left { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.status-bar-center { flex: 1; display: flex; align-items: center; gap: 10px; }
.status-progress-track {
  flex: 1; height: 4px;
  background: var(--line);
  border-radius: 999px; overflow: hidden;
}
.status-progress-bar {
  height: 100%; background: linear-gradient(90deg, var(--text), #4b5563);
  border-radius: 999px;
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.status-pct { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.status-bar-right { display: flex; gap: 8px; flex: none; }
.btn-status-secondary {
  padding: 6px 14px; border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--bg); color: var(--text);
  font-size: 12.5px; cursor: pointer;
}
.btn-status-primary {
  padding: 6px 14px; border-radius: 6px;
  border: none;
  background: var(--text); color: #fff;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.blocks-scroll { flex: 1; overflow-y: auto; padding: 20px; }
.blocks-empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 13.5px; }
.blocks-list { display: flex; flex-direction: column; gap: 12px; }

/* 模块卡片 */
.block-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  animation: cardFadeIn 0.28s ease-out;
}
@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.block-card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}
.block-card-title { font-size: 13.5px; font-weight: 600; flex: 1; }
.block-status-badge {
  font-size: 11px; padding: 2px 9px;
  border-radius: 999px; flex: none;
}
.block-status-badge.pending { background: var(--bg-2); color: var(--muted); }
.block-status-badge.extracting { background: #fef9c3; color: #854d0e; }
.block-status-badge.done { background: #dcfce7; color: #166534; }
.block-status-badge.error { background: #fee2e2; color: #991b1b; }
.block-card-progress {
  height: 2px; background: var(--line);
  overflow: hidden; display: none;
}
.block-card-progress.active { display: block; }
.block-card-progress-bar {
  height: 100%; background: #f59e0b;
  width: 30%; animation: slide 1.2s ease-in-out infinite;
}
@keyframes slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(400%); }
}
.block-card-grid {
  display: flex; flex-direction: column;
}

/* 章节卡片左右布局：左侧四项 + 右侧匹配素材 */
.block-card-body {
  display: grid;
  grid-template-columns: 1fr 280px;
}
.block-card-body > .block-card-grid { border-right: 1px solid var(--line); }
.block-card-matched {
  display: flex;
  flex-direction: column;
  background: var(--bg-2, #f9f9f7);
  min-height: 0;
}
.block-card-matched-header {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  font-size: 11.5px; font-weight: 700;
  color: var(--text);
  letter-spacing: 0.3px;
}
.block-card-matched-header .count {
  font-size: 10.5px; font-weight: 600;
  color: var(--muted);
  background: var(--bg-2);
  border: 1px solid var(--line);
  padding: 1px 7px; border-radius: 999px;
  font-family: 'SF Mono', ui-monospace, monospace;
}
.block-card-matched-list {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px;
  max-height: 220px;
  overflow-y: auto;
}
.block-card-matched-empty {
  padding: 24px 14px;
  text-align: center;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.6;
}
.bcm-card {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.12s, opacity 0.12s, background 0.12s;
}
.bcm-card:hover { border-color: var(--text); }
.bcm-keep {
  position: absolute;
  top: 4px;
  right: 4px;
  z-index: 1;
  cursor: pointer;
  padding: 4px;
  display: inline-flex;
  align-items: center;
}
.bcm-keep-cb {
  cursor: pointer;
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: #2563eb;
}
.bcm-card.removed {
  opacity: 0.45;
  background: var(--bg-2);
}
.bcm-card.removed .bcm-card-name {
  text-decoration: line-through;
}
.bcm-card-head {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 10px 5px;
}
.bcm-card-ext {
  font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
  padding: 2px 6px; border-radius: 4px; flex: none;
}
.bcm-card-name {
  flex: 1; font-size: 11.5px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bcm-card-chunk {
  font-size: 9.5px; font-family: 'SF Mono', ui-monospace, monospace;
  color: var(--muted); flex: none;
}
.bcm-card-body {
  padding: 0 10px 8px;
  font-size: 11.5px; color: var(--text);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 编辑弹窗（复用 workbench 样式） */
.edit-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 9999;
  display: grid; place-items: center;
  padding: 32px;
}
.edit-modal {
  width: min(800px, 92vw);
  max-height: 80vh;
  background: var(--panel, #fff);
  border-radius: 14px;
  box-shadow: 0 20px 60px -20px rgba(0,0,0,0.35);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.edit-modal-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2, #f9f9f7);
}
.edit-modal-title {
  flex: 1; font-size: 13.5px; font-weight: 700;
  color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.edit-modal-close {
  all: unset; cursor: pointer;
  width: 26px; height: 26px; border-radius: 6px;
  display: grid; place-items: center;
  font-size: 18px; color: var(--muted); flex: none;
}
.edit-modal-close:hover { background: var(--bg-2); color: var(--text); }
.edit-modal-body {
  flex: 1; overflow-y: auto;
  padding: 18px 20px;
  font-size: 14px; color: var(--text);
  line-height: 1.8;
  white-space: pre-wrap; word-break: break-word;
}
.block-field {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}
.block-field:last-child { border-bottom: none; }
.block-field-label {
  font-size: 11px; font-weight: 600;
  margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
}
.block-field-label.veto { color: #dc2626; }
.block-field-label.bonus { color: #16a34a; }
.block-field-label.score { color: #2563eb; }
.block-field-value { font-size: 12.5px; color: var(--text); line-height: 1.55; white-space: pre-wrap; }
.block-field-list {
  margin: 0; padding: 0 0 0 16px;
  font-size: 12.5px; color: var(--text); line-height: 1.6;
}
.block-field-list li { margin-bottom: 2px; }
.block-field-skeleton {
  height: 12px; background: var(--bg-2);
  border-radius: 4px; margin-bottom: 6px;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* 右侧边栏 */
.init-sidebar {
  width: 80px; flex: 0 0 80px;
  border-left: 1px solid var(--line);
  background: var(--panel);
  display: flex; flex-direction: column;
  transition: width 0.2s; overflow: hidden;
}
.sidebar-progress {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 14px 12px;
  border-bottom: 1px solid var(--line);
}
.ring-bg { stroke: var(--line); }
.ring-fill { stroke: var(--text); transition: stroke-dashoffset 0.4s; }
.sidebar-progress-text { font-size: 12px; color: var(--muted); }
.sidebar-toc { flex: 1; overflow-y: auto; padding: 8px 0; }
/* heading 条目 */
.toc-item {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 12px 5px 8px;
  font-size: 13px; font-weight: 700; color: var(--text);
  cursor: pointer; border: none; background: none;
  width: 100%; text-align: left;
  border-left: 2px solid transparent;
  min-height: 32px;
}
.toc-item.content {
  font-size: 12.5px; font-weight: 400;
  color: var(--muted);
  padding-left: 24px;
}

.stage-step {

    <script type="module">
import { api } from './assets/api.js';

const params = new URLSearchParams(location.search);
const projectId = params.get('projectId');
if (!projectId) { location.href = '/projects'; }
// URL 显式指定的视图模式（顶部进度条点击会带上）；空 / 非法值视为不覆盖
const _viewParam = params.get('view');
// URL 显式指定的 backend stage（跨视图跳转 click handler 会带）：作为 sessionStorage
// 兜底，确保 renderStageBar 第一次绘制就能用真实 backend stage 点亮 active。
const _backendParam = params.get('backend');
if (_backendParam && projectId) {
  try {
    // 只升不降（单调推进）
    const k = `furthestStage:${projectId}`;
    const prev = sessionStorage.getItem(k);
    const STAGE_ORDER_LITERAL = ['parsing', 'matching', 'generating', 'reviewing'];
    const STAGE_MAP_LITERAL = {
      parsing: 'parsing', outline_review: 'parsing',
      matching: 'matching', materials_review: 'matching',
      generating: 'generating',
      reviewing: 'reviewing',
      report_review: 'reviewing',
    };
    const prevIdx = prev ? STAGE_ORDER_LITERAL.indexOf(STAGE_MAP_LITERAL[prev] || '') : -1;
    const newIdx = STAGE_ORDER_LITERAL.indexOf(STAGE_MAP_LITERAL[_backendParam] || '');
    if (newIdx >= 0 && newIdx >= prevIdx) sessionStorage.setItem(k, _backendParam);
  } catch {}
}

// ── DOM refs ──
const reqStack   = document.getElementById('req-stack');
const srcStack   = document.getElementById('src-stack');
const reqCount   = document.getElementById('req-count');
const srcCount   = document.getElementById('src-count');
const btnAddReq  = document.getElementById('btn-add-req');
const btnAddSrc  = document.getElementById('btn-add-src');
const btnExtract = document.getElementById('btn-extract');
const modelBtn      = document.getElementById('model-selector-btn');
const modelLabel    = document.getElementById('model-selector-label');
const modelDropdown = document.getElementById('model-dropdown');
const modelListEl   = document.getElementById('model-list');
const statusBar  = document.getElementById('status-bar');
const statusLabel = document.getElementById('status-label');
const progressTrack = document.getElementById('progress-track');
const progressBar   = document.getElementById('progress-bar');
const statusPct     = document.getElementById('status-pct');
const statusActions = document.getElementById('status-actions');
const blocksList  = document.getElementById('blocks-list');
const blocksEmpty = document.getElementById('blocks-empty');
const sidebarToc  = document.getElementById('sidebar-toc');
const ringFill    = document.getElementById('ring-fill');
const sidebarProgressText = document.getElementById('sidebar-progress-text');
const fileInputReq = document.getElementById('file-input-req');
const fileInputSrc = document.getElementById('file-input-src');

// ── 状态 ──
let extractionState = 'idle'; // idle | extracting | done
let totalBlocks = 0;
let doneBlocks  = 0;
let matchedCount = 0; // 已匹配章节数（仅匹配阶段使用）
const matchedIds = new Set();
let currentReader = null;
let selectedModel = 'claude-sonnet-4-6';
let selectedModelLabel = 'Sonnet 4.6';

// ── workflow 运行态 ──
let currentThreadId = null;
let currentEventSource = null;
let currentGate = null; // null | 'review_outline' | 'review_materials' | 'review_report'
// URL backend 参数（来自顶部 stage-progress click）作为 currentStage 初值，
// 让 renderStageBar 第一次绘制就用上真实 backend stage，不依赖异步 state API。
// 没 URL backend 时用 sessionStorage furthestStage 兜底。
let currentStage = (() => {
  if (_backendParam && _backendParam.trim()) return _backendParam;
  try {
    const cached = sessionStorage.getItem(`furthestStage:${projectId}`);
    if (cached) return cached;
  } catch {}
  return null;
})();
const blocksByOrder = []; // 按 outline_extract 顺序累积，给 confirm 用
const blocksById = new Map();

// ── 视图模式：outline（提炼大纲） / matching（素材匹配） ──
// 优先级：URL ?view=... 显式指定 > 后端 stage > 大纲完成度。
// 这样从顶部进度条点击「解析大纲」/「素材匹配」可以强制切到对应视图，
// 即使大纲已全部提炼完成也能回到 outline 视图查看 / 编辑。
let pageViewOverride = (_viewParam === 'outline' || _viewParam === 'matching') ? _viewParam : null;
function applyPageView() {
  // 视图判定：单一规则 = 由 backend stage 决定，与项目实际所处步骤严格对齐。
  //   parsing / outline_review → outline 视图（解析大纲，含闸门 1 等待确认）
  //   matching / materials_review → matching 视图（素材匹配，含闸门 2 等待确认）
  // pageViewOverride（URL ?view=...）优先级最高，让用户能从顶部进度条主动回看。
  let auto;
  if (currentStage === 'matching' || currentStage === 'materials_review') {
    auto = 'matching';
  } else if (currentStage === 'parsing' || currentStage === 'outline_review') {
    auto = 'outline';
  } else if (currentStage) {
    // generating / reviewing / report_review 等：不属于 project-init 视图，但兜底回 outline
    auto = 'outline';
  } else {
    // 没 backend stage（新项目）：用本地大纲完成度决定
    auto = (totalBlocks > 0 && doneBlocks >= totalBlocks) ? 'matching' : 'outline';
  }
  const view = pageViewOverride || auto;
  document.body.dataset.view = view;
  // 同步底部按钮文案
  const btn = document.getElementById('btn-extract');
  const hint = document.querySelector('.materials-footer .extract-hint');
  if (btn && hint) {
    if (view === 'matching') {
      btn.innerHTML = '✦ 素材匹配';
      hint.textContent = '为每个章节匹配最相关的原始素材片段';
    } else {
      btn.innerHTML = '✦ 提炼大纲';
      hint.textContent = '依据应标要求生成章节结构，原始素材用于补充各模块内容';
    }
  }
  // view 切换会改变 PAGE_STAGE → 顶部进度条 active 跟着切
  if (typeof renderStageBar === 'function') renderStageBar();
}

const THREAD_KEY = (pid) => `workflow:${pid}`;
function getThread(pid) { try { return sessionStorage.getItem(THREAD_KEY(pid)); } catch { return null; } }
function setThread(pid, tid) { try { sessionStorage.setItem(THREAD_KEY(pid), tid); } catch {} }
function clearThread(pid) { try { sessionStorage.removeItem(THREAD_KEY(pid)); } catch {} }

// ── 顶部 stage 进度条 ──
const STAGE_ORDER = [
  'parsing', 'matching', 'generating', 'reviewing',
];
const STAGE_MAP = {
  parsing: 'parsing',
  // 闸门停留态映射回当前阶段：进度条颜色与"项目实际所处步骤"一致，
  // 避免"进度条点亮方案撰写但页面还是素材匹配"的认知冲突。
  outline_review: 'parsing',
  matching: 'matching',
  materials_review: 'matching',
  generating: 'generating',
  reviewing: 'reviewing',
  // 报告确认与双视角评审合并为同一 step "评审确认"
  report_review: 'reviewing',
};

// 当前页面承担的阶段：active step 永远是它，与 backendStage 解耦。
// project-init 视图分两种：outline 视图固定 'parsing'，matching 视图固定 'matching'。
function getPageStage() {
  return document.body.dataset.view === 'matching' ? 'matching' : 'parsing';
}

function setStage(stage) {
  if (!stage) return;
  // currentStage 单调推进：避免 SSE / state API 短暂返回更早的 stage（比如 graph
  // 重启瞬间的 'parsing'）把进度条颜色拉回来导致 active 抖动。
  // 例外：'aborted' 强制覆盖（终态）。
  if (currentStage && stage !== 'aborted' && stage !== 'done') {
    const prevMapped = STAGE_MAP[currentStage];
    const newMapped = STAGE_MAP[stage];
    const prevIdx = prevMapped ? STAGE_ORDER.indexOf(prevMapped) : -1;
    const newIdx = newMapped ? STAGE_ORDER.indexOf(newMapped) : -1;
    if (newIdx >= 0 && prevIdx >= 0 && newIdx < prevIdx) {
      // 倒退：忽略，不更新 currentStage 也不重绘
      return;
    }
  }
  currentStage = stage;
  // 维护项目级最远到达的 stage：renderStageBar 在 currentStage 暂时为空 / 比缓存更早时
  // 用它作 backendIdx 兜底，避免用户在 SSE / state 返回前点击进度条 step 被错判为 disabled。
  try {
    const mappedNew = STAGE_MAP[stage];
    if (mappedNew) {
      const newIdx = STAGE_ORDER.indexOf(mappedNew);
      const k = `furthestStage:${projectId}`;
      const prev = sessionStorage.getItem(k);
      const prevIdx = prev ? STAGE_ORDER.indexOf(STAGE_MAP[prev] || '') : -1;
      if (newIdx > prevIdx) sessionStorage.setItem(k, stage);
    }
  } catch {}
  applyPageView();
  renderStageBar();
}

// 重绘进度条：active = 后端当前 stage（蓝色 + 呼吸），
//              done = 已经过的阶段（绿色，可点击回看），
//              其余 = 灰色 disabled。
// 当前视图（PAGE_STAGE）只影响视图内容，不再决定 active 颜色。
function renderStageBar() {
  const root = document.getElementById('stage-progress');
  if (!root) return;
  if (root.hasAttribute('hidden')) root.removeAttribute('hidden');

  const pageStage = getPageStage();
  const pageIdx = STAGE_ORDER.indexOf(pageStage);
  // 后端实际所处阶段：
  //   1) currentStage（SSE / state API 拿到）
  //   2) sessionStorage furthest（同 project 在本会话中曾到达的最远 stage）
  //   3) PAGE_STAGE 兜底（用户既然在该页面，graph 至少到这）
  let backend = currentStage;
  if (!backend) {
    try {
      const cached = sessionStorage.getItem(`furthestStage:${projectId}`);
      if (cached) backend = cached;
    } catch {}
  }
  if (!backend && pageStage) backend = pageStage;

  let backendMapped = STAGE_MAP[backend];
  let backendIdx = backendMapped ? STAGE_ORDER.indexOf(backendMapped) : -1;
  if (backend === 'done') backendIdx = STAGE_ORDER.length;
  if (backend === 'aborted') backendIdx = pageIdx;
  // backend 至少不能比当前页面更早（用户已经在这页，说明 graph 至少到这）
  if (backendIdx < pageIdx) backendIdx = pageIdx;

  const steps = root.querySelectorAll('.stage-step');

  // aborted 特殊：把 backend 那一步标红，其他按 backendIdx 标 done
  if (backend === 'aborted') {
    steps.forEach(el => {
      const i = STAGE_ORDER.indexOf(el.dataset.stage);
      el.classList.remove('active', 'done', 'aborted');
      el.removeAttribute('aria-current');
      el.removeAttribute('aria-disabled');
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      if (i === backendIdx) {
        el.classList.add('aborted');
        el.setAttribute('aria-disabled', 'true');
        el.setAttribute('tabindex', '-1');
      } else if (i < backendIdx) {
        el.classList.add('done');
      } else {
        el.setAttribute('aria-disabled', 'true');
        el.setAttribute('tabindex', '-1');
      }
    });
    return;
  }

  steps.forEach(el => {
    const i = STAGE_ORDER.indexOf(el.dataset.stage);
    el.classList.remove('active', 'done', 'aborted');
    el.removeAttribute('aria-current');
    el.removeAttribute('aria-disabled');
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');

    if (i === backendIdx) {
      // 后端当前所处 stage：蓝色呼吸（active）
      el.classList.add('active');
      el.setAttribute('aria-current', 'step');
    } else if (i < backendIdx) {
      // 已完成阶段：绿色，可点击回看
      el.classList.add('done');
    } else {
      // 未到达：灰色 disabled，不允许点击切换视图
      el.setAttribute('aria-disabled', 'true');
      el.setAttribute('tabindex', '-1');
    }
    const name = el.querySelector('.stage-name')?.textContent || '';
    el.setAttribute('aria-label', `跳转到 ${name}`);
  });
}

function resetStageProgress() {
  // 进度条作为整体导航始终显示，仅清空 step 内部高亮（不再隐藏 nav）
  const root = document.getElementById('stage-progress');
  if (!root) return;
  root.querySelectorAll('.stage-step').forEach(el => {
    el.classList.remove('active', 'done', 'aborted');
  });
}

document.getElementById('stage-progress')?.addEventListener('click', (e) => {
  const step = e.target.closest('.stage-step');
  if (!step) return;
  if (step.classList.contains('aborted')) return;
  // 未到达阶段（aria-disabled）不允许点击切换视图
  if (step.getAttribute('aria-disabled') === 'true') return;
  const stage = step.dataset.stage;
  // tid 优先级：当前内存 > sessionStorage > URL（页面初次加载时三者都可能）
  let tid = currentThreadId
    || sessionStorage.getItem(`workflow:${projectId}`)
    || params.get('threadId');
  // 跳转前把 backend stage 写 sessionStorage（跨页面继承）+ URL（同步可靠源）。
  // sessionStorage 写入 + 读取在某些场景下可能与跳转时机错位，URL 是最稳的兜底。
  let backendForUrl = currentStage;
  if (!backendForUrl || !STAGE_MAP[backendForUrl]) {
    backendForUrl = sessionStorage.getItem(`furthestStage:${projectId}`) || '';
  }
  try {
    if (backendForUrl && STAGE_MAP[backendForUrl]) {
      const k = `furthestStage:${projectId}`;
      const prev = sessionStorage.getItem(k);
      const prevIdx = prev ? STAGE_ORDER.indexOf(STAGE_MAP[prev] || '') : -1;
      const newIdx = STAGE_ORDER.indexOf(STAGE_MAP[backendForUrl]);
      if (newIdx > prevIdx) sessionStorage.setItem(k, backendForUrl);
    }
  } catch {}
  const enc = tid ? encodeURIComponent(tid) : '';
  const tidQuery = tid ? `&threadId=${enc}` : '';
  const backendQuery = backendForUrl ? `&backend=${encodeURIComponent(backendForUrl)}` : '';
  const routes = {
    parsing: `/project-init?projectId=${projectId}${tidQuery}&view=outline${backendQuery}`,
    matching: `/project-init?projectId=${projectId}${tidQuery}&view=matching${backendQuery}`,
    generating: tid ? `/workbench?projectId=${projectId}${tidQuery}${backendQuery}` : null,
    reviewing: tid ? `/review?threadId=${enc}${backendQuery}` : null,
    report_review: tid ? `/review?threadId=${enc}${backendQuery}` : null,
  };
  if (routes[stage]) location.href = routes[stage];
});

document.getElementById('stage-progress')?.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const step = e.target.closest('.stage-step');
  if (!step) return;
  e.preventDefault();
  step.click();
});

async function loadModels() {
  try {
    const resp = await fetch('/api/configs').then(r => r.json());
    const configs = resp?.configs || [];
    if (!configs.length) { renderDefaultModels(); return; }
    if (!configs.find(c => c.model === selectedModel)) {
      selectedModel = configs[0].model;
      selectedModelLabel = configs[0].name || configs[0].model;
      modelLabel.textContent = selectedModelLabel;
    }
    modelListEl.innerHTML = configs.map(c => {
      const lbl = c.name || c.model;
      return `<div class="model-option${c.model === selectedModel ? ' selected' : ''}" data-model="${escHtml(c.model)}" data-label="${escHtml(lbl)}">
        <span>${escHtml(lbl)}</span>
        ${c.model === selectedModel ? '<span class="model-option-check">✓</span>' : ''}
      </div>`;
    }).join('');
  } catch { renderDefaultModels(); }
  bindModelOptions();
}

function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function extBadge(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  if (['docx','doc'].includes(ext)) return `<span class="mat-badge docx">DOCX</span>`;
  if (ext === 'pdf') return `<span class="mat-badge pdf">PDF</span>`;
  if (['ppt','pptx'].includes(ext)) return `<span class="mat-badge pptx">PPTX</span>`;
  return `<span class="mat-badge">${ext.toUpperCase()}</span>`;
}
function fmtSize(bytes) {
  if (!bytes) return '';
  return bytes > 1024*1024 ? (bytes/1024/1024).toFixed(1)+' MB' : (bytes/1024).toFixed(0)+' KB';
}

// ── 状态栏 ──
function setStatusBar(state, label, pct, totalB, doneB) {
  extractionState = state;
  statusBar.dataset.state = state;
  statusLabel.textContent = label;
  // 切出 gate_outline（含 idle / extracting / gate_materials / done）统一回到只读，避免在每个分支重复 freeze
  if (state !== 'gate_outline' && typeof freezeOutlineEdit === 'function') {
    freezeOutlineEdit();
  }
  if (state === 'idle') {
    progressTrack.style.display = 'none';
    statusActions.innerHTML = '';
    return;
  }
  progressTrack.style.display = 'block';
  progressBar.style.width = pct + '%';
  statusPct.textContent = `${doneB}/${totalB} 模块 · ${pct}%`;
  statusActions.innerHTML = '';
  if (state === 'extracting') {
    statusActions.innerHTML = `<button class="btn-status-secondary" id="btn-cancel">取消</button>`;
    document.getElementById('btn-cancel').addEventListener('click', cancelExtraction);
  } else if (state === 'gate_outline') {
    statusActions.innerHTML = `
      <button class="btn-status-secondary" id="btn-cancel">取消</button>
      <button class="btn-status-primary" id="btn-confirm-outline">确认大纲，继续匹配素材</button>`;
    document.getElementById('btn-cancel').addEventListener('click', cancelExtraction);
    document.getElementById('btn-confirm-outline').addEventListener('click', confirmOutlineGate);
    makeOutlineEditable();
  } else if (state === 'gate_materials') {
    statusActions.innerHTML = `
      <button class="btn-status-secondary" id="btn-rematch">重新匹配</button>
      <button class="btn-status-primary" id="btn-confirm-materials">确认素材，进入撰写</button>`;
    document.getElementById('btn-rematch').addEventListener('click', () => startMatching());
    document.getElementById('btn-confirm-materials').addEventListener('click', confirmMaterialsGate);
    freezeOutlineEdit();
  } else if (state === 'done') {
    // 文案随当前视图变：outline 视图下是「重新提炼 / 进入匹配」，
    // matching 视图下是「重新匹配 / 进入撰写」。
    const isMatchingView = document.body.dataset.view === 'matching';
    if (isMatchingView) {
      statusActions.innerHTML = `
        <button class="btn-status-secondary" id="btn-rematch">重新匹配</button>
        <button class="btn-status-primary" id="btn-confirm">进入撰写</button>`;
      document.getElementById('btn-rematch').addEventListener('click', () => startMatching());
      // 与 gate_materials 状态的「确认素材，进入撰写」按钮逻辑保持一致：
      // 先 resume('approve') 推 graph 进 generate，再跳 workbench。
      document.getElementById('btn-confirm').addEventListener('click', confirmMaterialsGate);
    } else {
      statusActions.innerHTML = `
        <button class="btn-status-secondary" id="btn-reextract">重新提炼</button>
        <button class="btn-status-primary" id="btn-to-matching">进入匹配</button>`;
      document.getElementById('btn-reextract').addEventListener('click', () => startExtraction(true));
      document.getElementById('btn-to-matching').addEventListener('click', () => startMatching());
    }
    freezeOutlineEdit();
  } else if (state === 'paused') {
    const isMatchingView = document.body.dataset.view === 'matching';
    if (isMatchingView) {
      statusActions.innerHTML = `
        <button class="btn-status-secondary" id="btn-rematch">重新匹配</button>
        <button class="btn-status-primary" id="btn-resume-match">继续匹配</button>`;
      document.getElementById('btn-rematch').addEventListener('click', () => startMatching());
      document.getElementById('btn-resume-match').addEventListener('click', () => startMatching());
    } else {
      statusActions.innerHTML = `
        <button class="btn-status-secondary" id="btn-reextract">重新提炼</button>
        <button class="btn-status-primary" id="btn-resume-extract">继续提炼</button>`;
      document.getElementById('btn-reextract').addEventListener('click', () => startExtraction(true));
      document.getElementById('btn-resume-extract').addEventListener('click', () => startExtraction(false));
    }
    freezeOutlineEdit();
  }
  applyPageView();
}

// ── 目录导航（初始全量构建） ──
function inferTocLevel(s) {
  // 优先用后端解析的真实 level（1-4）
  if (typeof s === 'object' && s && Number.isFinite(s.level)) {
    return Math.max(1, Math.min(4, s.level));
  }
  const title = typeof s === 'string' ? s : (s?.title || '');
  if (/^[一二三四五六七八九十百]+[、．\.]/.test(title)) return 1;
  if (/^第[一二三四五六七八九十百\d]+[章节篇]/.test(title)) return 1;
  if (/^\d+\.\d+/.test(title)) return 3;
  return 2;
}

function buildToc(blocks) {
  sidebarToc.innerHTML = '';
  const rawLevels = blocks.map(b => inferTocLevel(b));
  const minLevel = rawLevels.length ? Math.min(...rawLevels) : 1;
  const normalize = (raw) => Math.max(1, Math.min(4, raw - minLevel + 1));
  blocks.forEach((b, i) => {
    const blockId = b.block_id || b.id;
    const level = normalize(rawLevels[i]);
    const btn = document.createElement('button');
    btn.className = 'toc-item' + (level === 1 ? '' : level >= 3 ? ' content level-' + level : ' content');
    btn.id = `toc-${blockId}`;
    btn.dataset.blockId = blockId;
    if (level === 1) {
      btn.innerHTML = `<span class="toc-chevron">›</span><span class="toc-label" title="${escapeHtml(b.title)}">${escapeHtml(b.title)}</span>`;
    } else {
      btn.innerHTML = `<span class="toc-bullet"></span><span class="toc-label" title="${escapeHtml(b.title)}">${escapeHtml(b.title)}</span><span class="toc-dot"></span>`;
    }
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      // 关闭浮层
      document.getElementById('sidebar-toc').style.display = 'none';
      // 滚动到对应卡片
      const card = document.querySelector(`.block-card[data-block-id="${blockId}"]`);
      if (card) {
        const scroller = document.getElementById('blocks-scroll');
        if (scroller) {
          const top = card.offsetTop - scroller.offsetTop - 16;
          scroller.scrollTo({ top, behavior: 'smooth' });
        } else {
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
    sidebarToc.appendChild(btn);
  });
}
function markTocDone(blockId) {
  const btn = document.getElementById(`toc-${blockId}`);
  if (!btn) return;
  btn.classList.add('done');
  const dot = btn.querySelector('.toc-dot');
  if (dot) dot.style.background = '#16a34a';
}

  DOCX: { bg:'#e8efff', fg:'#1f4ed8' },
  DOC:  { bg:'#e8efff', fg:'#1f4ed8' },
  PPTX: { bg:'#fff1e0', fg:'#a35b00' },
  PPT:  { bg:'#fff1e0', fg:'#a35b00' },
};

function renderMatchedHtml(sources) {
  if (!sources || !sources.length) {
    return `<div class="block-card-matched-empty">暂无匹配素材</div>`;
  }
  return `<div class="block-card-matched-list">${sources.map((s, i) => {
    const filename = s.filename || '素材 #' + s.material_id;
    const ext = (filename.split('.').pop() || '').toUpperCase();
    const pal = FILE_BADGE_PALETTE[ext] || { bg:'#eee', fg:'#444' };
    const content = (s.content || '').trim();
    const payload = encodeURIComponent(JSON.stringify({ filename, chunk_index: s.chunk_index, content }));
    const chunkId = s.chunk_id ?? s.id ?? `${s.material_id}-${s.chunk_index}`;
    return `<div class="bcm-card" data-bcm-payload="${payload}" data-chunk-id="${escapeHtml(String(chunkId))}">
      <label class="bcm-keep" title="勾选 = 保留素材，取消勾选 = 在闸门 2 提交时剔除">
        <input type="checkbox" class="bcm-keep-cb" checked aria-label="保留该素材" />
      </label>
      <div class="bcm-card-head">
        <span class="bcm-card-ext" style="background:${pal.bg};color:${pal.fg};">${escapeHtml(ext)}</span>
        <span class="bcm-card-name" title="${escapeHtml(filename)}">${escapeHtml(filename)}</span>
        <span class="bcm-card-chunk">#${s.chunk_index}</span>
      </div>
      <div class="bcm-card-body">${escapeHtml(content)}</div>
    </div>`;
  }).join('')}</div>`;
}

// 点击匹配卡片 → 弹窗展示完整内容
document.addEventListener('click', e => {
  if (e.target.closest('.bcm-keep') || e.target.matches('.bcm-keep-cb')) return; // checkbox 不触发弹窗
  const card = e.target.closest('.bcm-card');
  if (!card || !card.dataset.bcmPayload) return;
  let data;
  try { data = JSON.parse(decodeURIComponent(card.dataset.bcmPayload)); } catch { return; }
  openBcmModal(data);
});

// checkbox 切换 → 给卡片加视觉提示
document.addEventListener('change', e => {
  const cb = e.target.matches?.('.bcm-keep-cb') ? e.target : null;
  if (!cb) return;
  const card = cb.closest('.bcm-card');
  if (!card) return;
  card.classList.toggle('removed', !cb.checked);
});

function openBcmModal({ filename, chunk_index, content }) {
  const overlay = document.createElement('div');
  overlay.className = 'edit-modal-overlay';
  overlay.innerHTML = `<div class="edit-modal">
    <div class="edit-modal-header">
      <span class="edit-modal-title">${escapeHtml(filename)} · #${chunk_index}</span>
      <button type="button" class="edit-modal-close" title="关闭">×</button>
    </div>
    <div class="edit-modal-body">${escapeHtml(content)}</div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.edit-modal-close').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

function parseSource(block) {
  // 优先用 SSE 事件直接带的 matched_sources 数组
  if (Array.isArray(block.matched_sources)) return block.matched_sources;
  try {
    const arr = JSON.parse(block.source || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}

function renderBlockCard(block, status = 'pending') {
  blocksEmpty.style.display = 'none';
  const el = document.createElement('div');
  el.className = 'block-card';
  el.dataset.blockId = block.block_id || block.id;
  const sources = parseSource(block);
  const badgeText = { pending: '待提炼', extracting: '提炼中', done: '已完成 ✓', error: '提炼失败' }[status] || status;
  el.innerHTML = `
    <div class="block-card-header">
      <span class="block-card-title">${escapeHtml(block.title)}</span>
      <span class="block-status-badge ${status}" ${block.error ? `title="${escapeHtml(block.error)}"` : ''}>${badgeText}</span>
    </div>
    <div class="block-card-progress ${status==='extracting'?'active':''}">
      <div class="block-card-progress-bar"></div>
    </div>
    <div class="block-card-body">
      <div class="block-card-grid">
        ${renderField('应标要求', block.requirement, '')}
        ${renderField('应标重点', block.key_points, '')}
        ${renderField('● 否决项', block.veto_items, 'veto')}
        ${renderField('★ 加分项', block.bonus_items, 'bonus')}
        ${renderField('☆ 评分项', block.score_items, 'score')}
        ${renderField('证明材料', block.evidence_required, '')}
        ${renderField('量化指标', block.indicators, '')}
      </div>
      <div class="block-card-matched">
        <div class="block-card-matched-header">
          匹配素材
          <span class="count">${sources.length}</span>
        </div>
        ${renderMatchedHtml(sources)}
      </div>
    </div>`;
  blocksList.appendChild(el);
}
function renderField(label, value, cls) {
  const isEmpty = !value;
  let content;
  if (isEmpty) {
    content = '<div class="block-field-skeleton" style="width:80%"></div><div class="block-field-skeleton" style="width:55%"></div>';
  } else {
    const lines = value.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length <= 1) {
      content = `<div class="block-field-value">${escapeHtml(value)}</div>`;
    } else {
      content = `<ul class="block-field-list">${lines.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>`;
    }
  }
  return `<div class="block-field">
    <div class="block-field-label ${cls}">${label}</div>
    ${content}
  </div>`;
}
function updateBlockCard(blockId, data) {
  // 闸门 1（gate_outline）/ 闸门 2（gate_materials）期间避免冲掉用户编辑：后端若重发 outline_extract / match_progress 直接忽略
  if (extractionState === 'gate_outline' || extractionState === 'gate_materials') return;
  const card = document.querySelector(`.block-card[data-block-id="${blockId}"]`);
  if (!card) return;
  card.querySelector('.block-status-badge').className = 'block-status-badge done';
  card.querySelector('.block-status-badge').textContent = '已完成 ✓';
  card.querySelector('.block-card-progress')?.classList.remove('active');
  const grid = card.querySelector('.block-card-grid');
  if (!grid) return;
  const labels = ['应标要求', '应标重点', '● 否决项', '★ 加分项', '☆ 评分项', '证明材料', '量化指标'];
  const vals   = [data.requirement||'', data.key_points||'', data.veto_items||'', data.bonus_items||'', data.score_items||'', data.evidence_required||'', data.indicators||''];
  const clss   = ['', '', 'veto', 'bonus', 'score', '', ''];
  grid.innerHTML = labels.map((lbl, i) => {
    const v = vals[i];
    let content;
    if (!v) {
      content = '<span style="color:var(--muted);font-size:12px;">—</span>';
    } else {
      const lines = v.split('\n').map(l => l.trim()).filter(Boolean);
      content = lines.length > 1
        ? `<ul class="block-field-list">${lines.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>`
        : `<div class="block-field-value">${escapeHtml(v)}</div>`;
    }
    return `<div class="block-field"><div class="block-field-label ${clss[i]}">${lbl}</div>${content}</div>`;
  }).join('');

  // 更新匹配素材
  const sources = data.matched_sources || [];
  const matchedWrap = card.querySelector('.block-card-matched');
  if (matchedWrap) {
    const cnt = matchedWrap.querySelector('.count');
    if (cnt) cnt.textContent = sources.length;
    const oldList = matchedWrap.querySelector('.block-card-matched-list, .block-card-matched-empty');
    if (oldList) oldList.remove();
    matchedWrap.insertAdjacentHTML('beforeend', renderMatchedHtml(sources));
  }
}

// ── 加载已有 blocks ──
async function loadExistingBlocks({ silent = false } = {}) {
  const blocks = await api.blocks.list(projectId);
  if (!blocks?.length) return;
  blocksList.innerHTML = '';
  blocksById.clear();
  blocksByOrder.length = 0;
  // 是否「已提炼」以 status 字段为权威：upsert 时写 'outline_done' 才算完成。
  // 不能用 key_points/requirement 是否为空兜底 —— 部分章节（纯目录、分组节点）
  // LLM 提炼后这两个字段就是空串，会被误判为未完成。
  const isDone = (b) => (b?.status === 'outline_done')
    || (b?.status === 'done')
    || !!(b?.key_points || b?.requirement);

  totalBlocks = blocks.length;
  doneBlocks = blocks.filter(isDone).length;
  blocks.forEach(b => {
    const blockId = b.block_id || b.id;
    blocksByOrder.push(b);
    blocksById.set(blockId, b);
    renderBlockCard(b, isDone(b) ? 'done' : 'pending');
  });
  buildToc(blocks);
  blocks.filter(isDone).forEach(b => markTocDone(b.block_id || b.id));
  updateSidebarProgress();
  applyPageView();
  if (silent) return;
  if (doneBlocks > 0) {
    const pct = Math.round(doneBlocks / totalBlocks * 100);
    const isMatching = document.body.dataset.view === 'matching';
    if (doneBlocks >= totalBlocks) {
      setStatusBar('done', isMatching ? '匹配完成' : '提炼完成', pct, totalBlocks, doneBlocks);
    } else {
      // 部分提炼/匹配（取消后保留的进度）：进入 paused 态，让用户继续 / 重新触发
      const tipDone = isMatching ? `已保留 ${doneBlocks}/${totalBlocks} 个已匹配章节` : `已保留 ${doneBlocks}/${totalBlocks} 个已提炼章节`;
      setStatusBar('paused', tipDone, pct, totalBlocks, doneBlocks);
    }
  } else if (totalBlocks > 0) {
    // 已解析章节但全部未提炼（解析后立即取消）：让用户能继续 / 重新提炼
    setStatusBar('paused', `已解析 ${totalBlocks} 个章节，可继续提炼`, 0, totalBlocks, 0);
  }
}

// ── 提炼流程（新 workflow driver） ──
function resetWorkflowUi() {
  blocksList.innerHTML = '';
  blocksEmpty.innerHTML = '<p>上传应标文件后点击「提炼大纲」开始</p>';
  blocksEmpty.style.display = 'block';
  sidebarToc.innerHTML = '';
  totalBlocks = 0; doneBlocks = 0;
  blocksByOrder.length = 0;
  blocksById.clear();
  currentGate = null;
  updateSidebarProgress();
}

function closeStream() {
  if (currentEventSource) {
    try { currentEventSource.close(); } catch {}
    currentEventSource = null;
  }
}

window.addEventListener('pagehide', closeStream);

function attachStream(threadId) {
  closeStream();
  currentEventSource = api.workflow.stream(threadId, {
    onStageChange: (data) => {
      if (typeof data?.stage === 'string') {
        setStage(data.stage);
      }
    },
    onParseProgress: (data) => {
      const step = data?.step || '解析规范书';
      const cur = data?.current ?? 0;
      const tot = data?.total ?? 0;
      // 仅在 parse_node 末尾显式发出的「解析完成」帧锁定总章节数。
      // parser 内部 sub-step（"切页 2/2" 等）也满足 cur===tot，但 tot 是 sub-step 的而非
      // 章节总数，会让 onOutlineExtract 的进度百分比超 100%。
      if (tot > 0 && step === '解析完成') {
        totalBlocks = tot;
        loadExistingBlocks({ silent: true }).catch(e => console.warn('loadExisting on parse_done failed', e));
      }
      const pct = tot ? Math.round(cur / tot * 100) : 0;
      setStatusBar('extracting', `张衡解析：${step} ${cur}/${tot}`, pct, totalBlocks || tot, doneBlocks);
      // 主区占位反馈：parse 阶段尚无 block 卡片，给用户进度感
      if (!blocksById.size) {
        blocksEmpty.innerHTML = `<p>正在解析文档结构…(${escapeHtml(step)} ${cur}/${tot})</p>`;
        blocksEmpty.style.display = 'block';
      }
    },
    onOutlineExtractStart: (data) => {
      // 章节真正开始处理：把对应卡片切到 'extracting' 态（骨架屏 + 闪烁进度条）。
      // 由于 parse 阶段已 silent 加载占位卡，这里直接找卡片切状态即可。
      const blockId = data?.block_id;
      if (!blockId) return;
      blocksEmpty.style.display = 'none';
      const card = document.querySelector(`.block-card[data-block-id="${blockId}"]`);
      if (!card) return;
      const badge = card.querySelector('.block-status-badge');
      if (badge) {
        badge.className = 'block-status-badge extracting';
        badge.textContent = '提炼中…';
      }
      const prog = card.querySelector('.block-card-progress');
      if (prog) prog.classList.add('active');
      // 滚动到首个 extracting 卡片，让用户看到当前焦点
      if (!document.querySelector('.block-card.scroll-locked')) {
        card.classList.add('scroll-locked');
        const scroller = document.getElementById('blocks-scroll');
        try {
          scroller ? scroller.scrollTo({ top: card.offsetTop - scroller.offsetTop - 16, behavior: 'smooth' })
                   : card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch {}
        setTimeout(() => card.classList.remove('scroll-locked'), 800);
      }
    },
    onOutlineExtract: (data) => {
      const blockId = data?.block_id;
      if (!blockId) return;
      const matrix = data.matrix || {};
      const block = {
        block_id: blockId,
        title: data.title || matrix.title || blockId,
        requirement: matrix.requirement || '',
        key_points: matrix.key_points || '',
        veto_items: matrix.veto_items || '',
        bonus_items: matrix.bonus_items || '',
        score_items: matrix.score_items || '',
        evidence_required: matrix.evidence_required || '',
        indicators: matrix.indicators || '',
      };
      const card = document.querySelector(`.block-card[data-block-id="${blockId}"]`);
      if (card) {
        // 已有占位 / extracting 卡片：原地更新到 done。
        // wasDone 判定与 loadExistingBlocks 一致：以 status='outline_done' 为权威，
        // 兜底允许 key_points/requirement 非空，避免重复 ++doneBlocks。
        const prev = blocksById.get(blockId) || {};
        const wasDone = (prev.status === 'outline_done')
          || (prev.status === 'done')
          || !!(prev.key_points || prev.requirement);
        blocksById.set(blockId, { ...prev, ...block, status: 'outline_done' });
        updateBlockCard(blockId, block);
        markTocDone(blockId);
        if (!wasDone) {
          doneBlocks++;
          if (!totalBlocks) totalBlocks = doneBlocks;
        }
      } else if (!blocksById.has(blockId)) {
        // 没有占位卡片（极端情况：解析跳过 / parse_progress 没收到完成帧）：临时补建
        blocksByOrder.push(block);
        blocksById.set(blockId, block);
        blocksEmpty.style.display = 'none';
        renderBlockCard(block, 'done');
        const level = inferTocLevel({ title: block.title });
        const tocBtn = document.createElement('button');
        tocBtn.className = 'toc-item' + (level === 1 ? '' : level >= 3 ? ' content level-' + level : ' content');
        tocBtn.id = `toc-${blockId}`;
        tocBtn.dataset.blockId = blockId;
        if (level === 1) {
          tocBtn.innerHTML = `<span class="toc-chevron">›</span><span class="toc-label" title="${escapeHtml(block.title)}">${escapeHtml(block.title)}</span>`;
        } else {
          tocBtn.innerHTML = `<span class="toc-bullet"></span><span class="toc-label" title="${escapeHtml(block.title)}">${escapeHtml(block.title)}</span><span class="toc-dot"></span>`;
        }
        tocBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('sidebar-toc').style.display = 'none';
          const c = document.querySelector(`.block-card[data-block-id="${blockId}"]`);
          if (c) {
            const scroller = document.getElementById('blocks-scroll');
            scroller ? scroller.scrollTo({ top: c.offsetTop - scroller.offsetTop - 16, behavior: 'smooth' }) : c.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
        sidebarToc.appendChild(tocBtn);
        markTocDone(blockId);
        doneBlocks++;
        if (!totalBlocks) totalBlocks = doneBlocks;
      } else {
        // 同一 block 二次更新但没有 DOM（不应发生）→ 兜底
        Object.assign(blocksById.get(blockId), block);
      }
      updateSidebarProgress();
      const pct = totalBlocks ? Math.round(doneBlocks / totalBlocks * 100) : 0;
      setStatusBar('extracting', `张衡提炼 ${doneBlocks}/${totalBlocks} 章节`, pct, totalBlocks, doneBlocks);
    },
    onMatchStart: (data) => {
      // 单 block 开始匹配：右侧"匹配素材"区切骨架屏 + 自动滚动聚焦
      const blockId = data?.block_id;
      if (!blockId) return;
      const card = document.querySelector(`.block-card[data-block-id="${blockId}"]`);
      if (!card) return;
      const matchedWrap = card.querySelector('.block-card-matched');
      if (matchedWrap) {
        const cnt = matchedWrap.querySelector('.count');
        if (cnt) cnt.textContent = '...';
        const oldList = matchedWrap.querySelector('.block-card-matched-list, .block-card-matched-empty');
        if (oldList) oldList.remove();
        const skeleton = document.createElement('div');
        skeleton.className = 'block-card-matched-empty';
        skeleton.style.opacity = '0.6';
        skeleton.textContent = '匹配中…';
        matchedWrap.appendChild(skeleton);
      }
      const prog = card.querySelector('.block-card-progress');
      if (prog) prog.classList.add('active');
      if (!document.querySelector('.block-card.scroll-locked')) {
        card.classList.add('scroll-locked');
        const scroller = document.getElementById('blocks-scroll');
        try {
          scroller ? scroller.scrollTo({ top: card.offsetTop - scroller.offsetTop - 16, behavior: 'smooth' })
                   : card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch {}
        setTimeout(() => card.classList.remove('scroll-locked'), 800);
      }
    },
    onMatchProgress: (data) => {
      const blockId = data?.block_id;
      if (!blockId) return;
      const matches = Array.isArray(data.matches) ? data.matches : [];
      const existing = blocksById.get(blockId) || {};
      existing.matched_sources = matches;
      blocksById.set(blockId, existing);
      updateBlockCard(blockId, { ...existing, matched_sources: matches });
      // 关掉进度条动画
      const card = document.querySelector(`.block-card[data-block-id="${blockId}"]`);
      const prog = card?.querySelector('.block-card-progress');
      if (prog) prog.classList.remove('active');
      if (!matchedIds.has(blockId)) {
        matchedIds.add(blockId);
        matchedCount = matchedIds.size;
      }
      const tot = totalBlocks || matchedCount;
      const pct = tot ? Math.round(matchedCount / tot * 100) : 0;
      setStatusBar('extracting', `沈括匹配素材 ${matchedCount}/${tot} 章节`, pct, tot, matchedCount);
    },
    onGateOpen: (data) => {
      const gate = data?.gate;
      currentGate = gate;
      const pct = totalBlocks ? Math.round(doneBlocks / totalBlocks * 100) : 100;
      if (gate === 'review_outline') {
        setStatusBar('gate_outline', '大纲提炼完成，请检查并编辑后继续匹配素材', pct, totalBlocks, doneBlocks);
      } else if (gate === 'review_materials') {
        setStatusBar('gate_materials', '素材匹配完成，请确认后进入撰写', pct, totalBlocks, doneBlocks);
      } else if (gate === 'review_report') {
        // 该闸门不属于本页，但兜底标记完成
        setStatusBar('done', '工作流已进入审核阶段', 100, totalBlocks, doneBlocks);
      }
    },
    onError: (data) => {
      const msg = data?.message || '工作流出错';
      const blockId = data?.block_id;
      if (blockId) {
        markBlockError(blockId, msg);
      }
      const pct = totalBlocks ? Math.round(doneBlocks / totalBlocks * 100) : 0;
      setStatusBar('extracting', `错误：${msg}`, pct, totalBlocks, doneBlocks);
      console.error('[workflow] error', data);
    },
    onCheckpoint: (data) => {
      console.debug('[workflow] checkpoint', data);
    },
    onAborted: (data) => {
      console.warn('[workflow] aborted', data);
      closeStream();
      clearThread(projectId);
      currentThreadId = null;
      currentGate = null;
      btnExtract.disabled = false;
      setStatusBar('idle', '', 0, 0, 0);
    },
    onDone: (data) => {
      console.debug('[workflow] done', data);
    },
  });
}

async function startExtraction(forceRestart = false) {
  // forceRestart：用户点「重新提炼」，先 abort 旧 thread 再起新
  resetWorkflowUi();
  if (forceRestart) {
    // 重新提炼回到「解析大纲」视图：清掉视图覆盖；不直接重置 currentStage 到 'parsing'，
    // 否则进度条 active 会回退到「解析大纲」蓝色（但 graph 实际仍处于更后阶段）。
    // 真实 stage 由 graph 跑起来时 SSE / state 返回。
    pageViewOverride = 'outline';
    // 同步 URL 上 view 参数，避免页面跳转 / 刷新后又被旧的 view=matching 拉回去
    try {
      const url = new URL(location.href);
      url.searchParams.set('view', 'outline');
      history.replaceState({}, '', url);
    } catch {}
    applyPageView();
  }
  setStatusBar('extracting', '准备提炼…', 0, 0, 0);
  btnExtract.disabled = true;

  try {
    if (forceRestart && currentThreadId) {
      try { await api.workflow.abort(currentThreadId); } catch {}
      clearThread(projectId);
      currentThreadId = null;
    }
    if (forceRestart) {
      // 重新提炼：清空已落库的 blocks，避免 extract 节点把旧 outline_done 当已完成跳过
      try { await api.blocks.clear(projectId); } catch (e) { console.warn('clear blocks failed', e); }
    }

    let threadId = forceRestart ? null : getThread(projectId);
    if (threadId) {
      try {
        await api.workflow.recover(threadId);
      } catch (e) {
        console.warn('[workflow] recover 失败，重启', e);
        threadId = null;
        clearThread(projectId);
      }
    }
    if (!threadId) {
      const resp = await api.workflow.start(projectId, { model: selectedModel });
      threadId = resp?.thread_id;
      if (!threadId) {
        setStatusBar('idle', '', 0, 0, 0);
        btnExtract.disabled = false;
        console.error('[workflow] start 未返回 thread_id', resp);
        return;
      }
      setThread(projectId, threadId);
    }
    currentThreadId = threadId;
    attachStream(threadId);
  } catch (e) {
    console.error('[workflow] startExtraction 失败', e);
    setStatusBar('idle', '', 0, 0, 0);
    btnExtract.disabled = false;
  }
}

async function startMatching() {
  // 「素材匹配」按钮：根据当前 thread / stage 决定推进路径，绝不重新跑 parse/extract。
  // - 没 thread：start 一个新 thread（仅在没 outline 时才会发生），等到 stage=outline_review
  //   后 resume('approve') 进入 match。
  // - stage=outline_review：直接 resume('approve') → graph 跑 match。
  // - stage=materials_review：rerun-match 端点把指针拨回 GATE_OUTLINE 后续 → match 重跑。
  // - 其它 stage：报错并让按钮可重试。
  btnExtract.disabled = true;
  matchedIds.clear();
  matchedCount = 0;
  setStatusBar('extracting', '准备进入素材匹配…', 0, totalBlocks, doneBlocks);
  try {
    let tid = currentThreadId || getThread(projectId);
    let stage = currentStage;
    if (tid) {
      try {
        const s = await api.workflow.state(tid);
        stage = s?.stage;
        // 用 setStage 而非直接赋值：单调保护避免 backend stage 比当前内存里更早时拉回
        if (stage) setStage(stage);
      } catch {}
    }
    if (!tid) {
      const resp = await api.workflow.start(projectId, { model: selectedModel });
      tid = resp?.thread_id;
      if (!tid) {
        setStatusBar('idle', '', 0, 0, 0);
        btnExtract.disabled = false;
        return;
      }
      setThread(projectId, tid);
      currentThreadId = tid;
      attachStream(tid);
      stage = await waitForStage(tid, 'outline_review', 60_000);
    } else if (!currentEventSource) {
      attachStream(tid);
    }
    if (stage === 'outline_review') {
      await api.workflow.resume(tid, 'approve', {});
      setStatusBar('extracting', '沈括匹配素材中…', 0, totalBlocks, doneBlocks);
    } else if (stage === 'materials_review') {
      // 已经停在闸门 2，按"重新匹配"语义把指针拨回 NODE_MATCH 之前
      // emitter 会重建，旧 SSE 连接收不到新事件 → 重连一次
      closeStream();
      await api.workflow.rerunMatch(tid);
      attachStream(tid);
      setStatusBar('extracting', '沈括匹配素材中…', 0, totalBlocks, doneBlocks);
    } else if (['report_review', 'done', 'paused'].includes(stage)) {
      // 补充的素材由局部修订入口实时读取，返回质量检查选择受影响章节。
      location.href = `/review?projectId=${projectId}&threadId=${encodeURIComponent(tid)}`;
    } else {
      console.warn('[matching] 当前 stage 不可触发匹配：', stage);
      setStatusBar('idle', '', 0, 0, 0);
      btnExtract.disabled = false;
    }
  } catch (e) {
    console.error('[matching] startMatching 失败', e);
    btnExtract.disabled = false;
  }
}

async function waitForStage(tid, expected, timeoutMs = 60_000) {
  const start = Date.now();
  while (Date.now() - start < timeoutMs) {
    try {
      const s = await api.workflow.state(tid);
      const stage = s?.stage;
      if (stage === expected) return stage;
      if (stage === 'aborted' || stage === 'done') return stage;
    } catch {}
    await new Promise(r => setTimeout(r, 600));
  }
  return null;
}

async function cancelExtraction() {
  if (currentThreadId) {
    try { await api.workflow.abort(currentThreadId); } catch (e) { console.warn('abort failed', e); }
  }
  closeStream();
  // 不清 thread / 不清卡片：已提炼内容由后端 upsert_outline_block 持久化，
  // 用户在主页或刷新后仍能看到。状态栏切到 'paused' 提示已停止 + 可重新提炼。
  clearThread(projectId);
  currentThreadId = null;
  currentGate = null;
  btnExtract.disabled = false;
  const pct = totalBlocks ? Math.round(doneBlocks / totalBlocks * 100) : 0;
  setStatusBar('paused', `已取消，已保留 ${doneBlocks}/${totalBlocks || doneBlocks} 个已提炼章节`, pct, totalBlocks || doneBlocks, doneBlocks);
}

async function confirmOutlineGate() {
  if (!currentThreadId) return;
  const btn = document.getElementById('btn-confirm-outline');
  if (btn) btn.disabled = true;
  try {
    const matrix = collectOutlineEdits();
    freezeOutlineEdit();
    await api.workflow.resume(currentThreadId, 'approve', {
      spec: { outline_matrix: matrix },
    });
    setStatusBar('extracting', '沈括匹配素材中…', 0, totalBlocks, doneBlocks);
  } catch (e) {
    console.error('[workflow] resume(review_outline) 失败', e);
    if (btn) btn.disabled = false;
  }
}

// ── 闸门 1：可编辑大纲工具 ──
// 字段顺序与 renderBlockCard 的 7 个 renderField 调用严格对齐：
// requirement / key_points / veto_items / bonus_items / score_items / evidence_required / indicators
// （constraint_level 当前 UI 不渲染，提交时不覆盖后端默认值）
const OUTLINE_FIELD_KEYS = [
  'requirement',
  'key_points',
  'veto_items',
  'bonus_items',
  'score_items',
  'evidence_required',
  'indicators',
];

function makeOutlineEditable() {
  document.querySelectorAll('.block-card').forEach(card => {
    card.querySelectorAll('.block-field-value, .block-field-list').forEach(el => {
      el.setAttribute('contenteditable', 'true');
      el.dataset.editable = '1';
    });
  });
}

function freezeOutlineEdit() {
  document.querySelectorAll('.block-card [data-editable="1"]').forEach(el => {
    el.removeAttribute('contenteditable');
    delete el.dataset.editable;
  });
}

function collectOutlineEdits() {
  const matrix = {};
  document.querySelectorAll('.block-card').forEach(card => {
    const blockId = card.dataset.blockId;
    if (!blockId) return;
    const grid = card.querySelector('.block-card-grid');
    if (!grid) return;
    const fields = grid.querySelectorAll('.block-field');
    const existing = blocksById.get(blockId) || {};
    const row = {
      block_id: blockId,
      title: existing.title || '',
    };
    fields.forEach((f, i) => {
      if (i >= OUTLINE_FIELD_KEYS.length) return;
      const list = f.querySelector('.block-field-list');
      const value = f.querySelector('.block-field-value');
      let text = '';
      if (list) {
        text = Array.from(list.querySelectorAll('li'))
          .map(li => li.innerText.trim())
          .filter(Boolean)
          .join('\n');
      } else if (value) {
        text = value.innerText.trim();
      }
      row[OUTLINE_FIELD_KEYS[i]] = text;
    });
    matrix[blockId] = row;
    // 同步回本地副本，避免后续 updateBlockCard / 其它分支用旧数据重渲染
    const stored = blocksById.get(blockId);
    if (stored) Object.assign(stored, row);
  });
  return matrix;
}

async function confirmMaterialsGate() {
  if (!currentThreadId) return;
  const btn = document.getElementById('btn-confirm-materials');
  if (btn) btn.disabled = true;
  try {
    const matches = collectMaterialEdits();
    const tid = currentThreadId;
    await api.workflow.resume(currentThreadId, 'approve', {
      materials: { matches },
    });
    // runner.resume 是 fire-and-forget：HTTP 200 时后端 task 仍未把 user_choice
    // 落到 checkpoint。这里等 user_choice='approve' 写盘后再跳，否则 workbench
    // 拿到 stage='materials_review' + user_choice='' 会跳回 project-init（ping-pong）。
    await waitForGateCommitted(tid, 'approve', 3000);
    // 显式带 backend=generating：用户点确认后已经"进入撰写"阶段，即使 backend state api
    // 仍返回 materials_review（graph 还没跑到 generate 节点），workbench 进度条也会立即
    // 把"方案撰写"标蓝。从 workbench 跳回素材匹配时也会保留正确的 furthestStage。
    location.href = `/workbench?projectId=${projectId}&threadId=${encodeURIComponent(tid)}&backend=generating`;
  } catch (e) {
    console.error('[workflow] resume(review_materials) 失败', e);
    if (btn) btn.disabled = false;
  }
}

// 轮询 workflow state，直到 user_choice 更新为 expected（说明 runner._resume_until_pause
// 已 aupdate_state 落盘）；超时即 fallthrough，workbench 端有兜底分支。
async function waitForGateCommitted(tid, expected, timeoutMs) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    try {
      const s = await api.workflow.state(tid);
      if (s?.user_choice === expected) return;
    } catch {}
    await new Promise(r => setTimeout(r, 150));
  }
}

// 收集闸门 2 的素材剔除结果：返回 { block_id: [filtered matched_sources...] }
function collectMaterialEdits() {
  const matches = {};
  document.querySelectorAll('.block-card').forEach(card => {
    const blockId = card.dataset.blockId;
    if (!blockId) return;
    const stored = blocksById.get(blockId);
    const allSources = stored?.matched_sources || [];
    if (!allSources.length) return;
    const keptIds = new Set();
    card.querySelectorAll('.bcm-card').forEach(cardEl => {
      const cb = cardEl.querySelector('.bcm-keep-cb');
      if (!cb || !cb.checked) return;
      const cid = cardEl.dataset.chunkId;
      if (cid) keptIds.add(String(cid));
    });
    const filtered = allSources.filter(s => {
      const cid = s.chunk_id ?? s.id ?? `${s.material_id}-${s.chunk_index}`;
      return keptIds.has(String(cid));
    });
    matches[blockId] = filtered;
  });
  return matches;
}

async function confirmOutline() {
  // 老入口兜底：若没有走新流程而点了「进入撰写」，直接跳转
  const btn = document.getElementById('btn-confirm');
  if (btn) btn.disabled = true;
  const tid = currentThreadId || getThread(projectId);
  const qs = tid
    ? `?projectId=${projectId}&threadId=${encodeURIComponent(tid)}`
    : `?projectId=${projectId}`;
  location.href = `/workbench${qs}`;
}

  btn.disabled = true;
  await api.materials.upload(projectId, file, role);
  await loadMaterials();
  btn.disabled = false;
}

// ── 事件绑定 ──

btnAddSrc.addEventListener('click', () => fileInputSrc.click());

    startMatching();

// ── 初始化 ──
api.projects.get(projectId).then(p => {
  if (!p?.name) return;
  document.getElementById('header-project-name').textContent = p.name;
  document.title = `AiBidding · ${p.name}`;
});
// 目录展开/收起（点击进度环）
document.getElementById('sidebar-ring-wrap').addEventListener('click', (e) => {
  e.stopPropagation();
  const toc = document.getElementById('sidebar-toc');
  toc.style.display = toc.style.display === 'none' ? 'block' : 'none';
});
document.addEventListener('click', () => {
  const toc = document.getElementById('sidebar-toc');
  if (toc) toc.style.display = 'none';
});

// 自动提炼：立即显示提炼状态栏，材料加载完后发请求
if (params.get('autoExtract') === '1') {
  statusBar.dataset.state = 'extracting';
  statusLabel.textContent = '准备提炼…';
  progressTrack.style.display = 'block';
  progressBar.style.width = '0%';
  statusPct.textContent = '0/0 模块 · 0%';
  statusActions.innerHTML = `<button class="btn-status-secondary" id="btn-cancel">取消提炼</button>`;
  statusActions.querySelector('#btn-cancel')?.addEventListener('click', cancelExtraction);
  btnExtract.disabled = true;
  Promise.all([loadMaterials(), loadExistingBlocks(), loadModels()]).then(() => {
    // 稍等确保材料写入完成
    setTimeout(() => startExtraction(), 500);
  });
} else {
  loadMaterials();
  loadExistingBlocks();
  loadModels();
}

// 还原 stage 进度（断线续连场景）
(() => {
  // 用 URL 的 view 参数推算 backendStage 下界：用户能从顶部进度条点过来，
  // 必然是 graph 已到达过的阶段。这样在 IIFE 异步 fetch 还没返回前，进度条
  // 也能立即按"matching 已可达"渲染，避免 step 被错误 disabled。
  try {
    if (_viewParam === 'matching') {
      const k = `furthestStage:${projectId}`;
      const prev = sessionStorage.getItem(k);
      const prevIdx = prev ? STAGE_ORDER.indexOf(STAGE_MAP[prev] || '') : -1;
      if (prevIdx < 1) sessionStorage.setItem(k, 'materials_review');
    }
  } catch {}

  // 进入页面立刻按 PAGE_STAGE 点亮当前 step（active 不依赖后端 state，
  // 否则在请求返回前进度条会全灰，看似"loading 没完成"）
  renderStageBar();

  // URL 含 threadId（从 /projects 路由进来或顶部进度条历史回看）→ 优先写入 sessionStorage
  const urlTid = params.get('threadId');
  if (urlTid) {
    setThread(projectId, urlTid);
    currentThreadId = urlTid;
  }
  const tid = urlTid || getThread(projectId);

  // 先用 workflow-runs 表里的 stage 兜底点亮进度条（这是 routes 层 update_stage 持久化的版本，
  // 即使 runner 内存清空 / checkpoint 读失败也能拿到）。然后再 best-effort 用 state API 校准。
  fetch(`/api/projects/${projectId}/workflow-runs`).then(r => r.ok ? r.json() : []).then(runs => {
    const latest = Array.isArray(runs) && runs.length ? runs[0] : null;
    if (latest && latest.stage && STAGE_MAP[latest.stage]) {
      // 没 thread 时也接受 workflow-runs 提供的 thread_id，确保 step 点击带上 threadId
      if (!currentThreadId && latest.thread_id) {
        setThread(projectId, latest.thread_id);
        currentThreadId = latest.thread_id;
      }
      setStage(latest.stage);
    }
  }).catch(() => {});

  if (!tid) {
    // 无 thread：进度条已默认可见且所有 step 灰显，无需额外处理
    return;
  }
  api.workflow.state(tid).then(s => {
    const stage = s?.stage;
    // 仅当 stage 是真实进行中的工作流阶段时才覆盖前面 workflow-runs 设置的进度
    if (stage && STAGE_MAP[stage]) {
      setStage(stage);
    } else if (stage === 'done' || stage === 'aborted') {
      // 终态需要清掉过期 threadId
      resetStageProgress();
      clearThread(projectId);
    }
    // 其它情况（idle / 空 stage）保持 workflow-runs 兜底的进度，不主动清空
  }).catch(() => {
    // 后端无该 thread / 请求失败 → 不主动清空，保留 workflow-runs 的兜底
  });
})();
