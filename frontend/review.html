<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiBidding · 质量检查</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="./assets/review.css?v=20260916-loop2" />
  <link rel="stylesheet" href="./assets/workspace.css?v=20260916-loop2" />
  </head>
  <body>
    <div class="workspace-shell">
      <main class="workspace-main-shell">
        <header class="project-header">
          <a class="project-name" id="header-project-name" href="/projects">← 项目列表</a>
          <nav id="workspace-nav" aria-label="项目工作区"></nav>
          <div class="project-actions">
            <div class="model-selector-wrap">
              <button class="model-selector-btn" id="model-selector-btn" type="button">
                <span class="model-dot"></span>
                <span id="model-selector-label">模型配置</span>
                <span style="font-size:10px;color:var(--muted)">▾</span>
              </button>
              <div class="model-dropdown" id="model-dropdown">
                <div class="model-dropdown-header">提炼模型</div>
                <div class="model-list" id="model-list"></div>
                <div class="model-dropdown-footer">
                  <button class="btn-add-config" id="btn-add-config" type="button">
                    <span class="btn-add-config-left">
                      <span class="btn-add-config-plus">＋</span>
                      <span>添加 API 配置</span>
                    </span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </header>

        <div class="quality-content">
          <section class="quality-summary" id="quality-summary" aria-label="质量概览"></section>
          <details class="quality-report"><summary>全局报告与运行结论</summary>
            <div id="quality-report-body"></div>
            <div id="convergence-bar" class="convergence-bar" hidden>
              <span class="cv-iteration">第 <b id="cv-round">1</b> 轮</span>
              <span id="cv-status" class="cv-status"></span><span id="cv-unconverged" class="cv-unconverged"></span>
            </div>
          </details>
          <div class="quality-toolbar">
            <span id="quality-selection" role="status">请选择章节处理</span>
            <div><button id="quality-revise" class="ws-button" disabled>按意见修订</button>
              <button id="quality-recheck" class="ws-button ws-primary" disabled>仅复审</button>
              <button id="quality-approve" class="ws-button" disabled>确认本轮完成</button><button id="quality-export" class="ws-button" disabled>导出当前正文</button></div>
          </div>
          <div class="quality-layout">
            <aside class="quality-queue" aria-label="章节与问题">
              <h2>章节与问题</h2>
              <input id="quality-search" type="search" placeholder="搜索章节或评审问题" aria-label="搜索章节或评审问题" />
              <select id="quality-filter" aria-label="筛选章节状态">
                <option value="all">全部章节</option><option value="attention">需要处理</option>
                <option value="material">待补料</option><option value="stale">待复审</option>
                <option value="passed">已通过</option><option value="empty">待撰写</option>
              </select>
              <div class="quality-queue-actions"><button id="quality-select-visible">选择当前筛选结果</button><button id="quality-clear">清空选择</button></div>
              <div id="quality-list"></div>
              <button id="quality-more" hidden>显示更多章节</button>
            </aside>
            <section class="quality-document" aria-label="正文与修改对比">
              <header><div><span class="ws-muted" id="quality-breadcrumb">当前草稿</span><h2 id="quality-title">选择一个章节</h2></div><a id="quality-edit" hidden>编辑正文</a></header>
              <div class="quality-doc-tabs" role="group" aria-label="正文视图"><button data-doc-mode="current" aria-pressed="true">当前正文</button><button data-doc-mode="diff" aria-pressed="false">与上次评审对比</button><button id="quality-history">章节版本</button></div>
              <div id="quality-document-body" class="quality-document-body"><p>从左侧选择章节，查看正文、评审依据和修订意见。</p></div>
            </section>
            <aside class="quality-findings" id="quality-findings" aria-label="评审意见"><h2>评审意见</h2><p>选择章节后展示。</p></aside>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./assets/review.js?v=20260916-loop2"></script>
  <script type="module" src="./assets/workspace.js?v=20260916-loop2"></script>
  </body>
</html>
