<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能应标 · 材料撰写</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <style>
      /* Outline pane */
      .outline-pane {
        width: 240px;
        flex: 0 0 240px;
        background: var(--bg);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        height: calc(100vh - 64px);
        overflow: hidden;
      }
      .outline-pane-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
        flex: 0 0 auto;
      }
      .outline-pane-header h3 {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--ink-4);
        font-family: "SF Mono", ui-monospace, monospace;
      }
      .outline-progress-badge {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--ink-3);
        background: var(--surface-2);
        border: 1px solid var(--line);
        padding: 1px 7px;
        border-radius: 999px;
        font-family: "SF Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .outline-progress-footer {
        flex: 0 0 auto;
        padding: 10px 14px 14px;
        border-top: 1px solid var(--line-2);
        background: var(--surface-2);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .outline-progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }
      .outline-progress-track {
        height: 4px;
        background: var(--line-2);
        border-radius: 999px;
        overflow: hidden;
      }
      .outline-progress-bar {
        height: 100%;
        background: var(--ink);
        border-radius: 999px;
        width: 0%;
        transition: width 0.3s;
      }
      .doc-outline {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0;
      }
      .doc-outline-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 32px;
        padding: 6px 12px;
        border: 0;
        border-left: 2px solid transparent;
        background: transparent;
        color: var(--ink-3);
        font: inherit;
        font-size: 12.5px;
        line-height: 1.35;
        text-align: left;
        cursor: pointer;
        transition: background 0.1s;
      }
      .doc-outline-item.sub {
        font-size: 12px;
        color: var(--ink-4);
      }
      .doc-outline-item:hover {
        background: var(--bg-2);
        color: var(--ink-2);
      }
      .doc-outline-item.active {
        background: var(--accent-soft);
        border-left-color: var(--accent);
        color: var(--ink);
        font-weight: 700;
      }
      .outline-tree-node { display: flex; flex-direction: column; }
      .outline-children { overflow: hidden; }
      .outline-children[hidden] { display: none; }
      .outline-chevron, .outline-dot {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        color: var(--ink-4);
        transition: transform 0.15s;
      }
      .doc-outline-item.collapsed .outline-chevron { transform: rotate(-90deg); }
      .outline-item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* Editor pane */
      .editor-pane {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        height: calc(100vh - 64px);
        overflow: hidden;
      }
      /* ── 章节标题头 ── */
      .section-header {
        flex: 0 0 auto;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .section-header-actions { display: flex; gap: 8px; flex: none; }
      .btn-mark-done {
        all: unset;
        cursor: pointer;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        font-size: 12.5px;
        color: var(--ink-2);
        background: var(--surface);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: background 0.1s;
      }
      .btn-mark-done:hover { background: var(--bg-2); }

      /* ── 提炼参考折叠区 ── */
      .ref-section {
        flex: 0 0 auto;
        padding: 10px 20px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--line);
      }
      .ref-section-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--ink-4);
        font-family: "SF Mono", ui-monospace, monospace;
        letter-spacing: 0.8px;
      }
      .ref-section-label .ref-divider {
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .ref-cards-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .ref-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
        transition: border-color 0.15s;
      }
      .ref-card.open { border-color: var(--ref-card-border, var(--line)); }
      .ref-card-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 9px;
        cursor: pointer;
        user-select: none;
        background: var(--surface);
        transition: background 0.12s;
      }
      .ref-card.open .ref-card-header { background: var(--ref-card-soft, var(--surface-2)); }
      .ref-card-header:hover { background: var(--ref-card-soft, var(--surface-2)); }
      .ref-card-icon {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        display: grid;
        place-items: center;
        flex: none;
        color: #fff;
      }
      .ref-card-label {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--ink);
        flex: 1;
      }
      .ref-card-count {
        font-size: 10px;
        font-weight: 700;
        font-family: "SF Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .ref-card-chevron {
        color: var(--ink-4);
        transition: transform 0.15s;
        flex: none;
        display: inline-flex;
      }
      .ref-card.open .ref-card-chevron { transform: rotate(0deg); }
      .ref-card-chevron { transform: rotate(-90deg); }
      .ref-card-body {
        padding: 8px 10px;
        font-size: 12px;
        color: var(--ink-2);
        line-height: 1.6;
        max-height: 160px;
        overflow-y: auto;
        display: none;
        border-top: 1px solid var(--ref-card-border, var(--line-2));
      }
      .ref-card.open .ref-card-body { display: block; }
      .ref-bullet-list {
        margin: 0; padding: 0; list-style: none;
        display: flex; flex-direction: column; gap: 6px;
      }
      .ref-bullet-list li {
        display: flex; gap: 7px;
        font-size: 12px; color: var(--ink-2); line-height: 1.55;
      }
      .ref-bullet-num {
        flex: none;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 10px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        min-width: 16px;
        padding-top: 2px;
      }

      /* ── 原有 editor-toolbar 保留，重命名为 batch-toolbar ── */
      .editor-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        flex: 0 0 auto;
        display: none; /* hidden — replaced by section-header */
      }
      .breadcrumb {
        font-size: 12.5px;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .breadcrumb span { color: var(--ink-4); }
      .generate-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn-generate-all {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border: 1px solid var(--ink);
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.1s;
      }
      .btn-generate-all:hover { background: var(--ink-2); border-color: var(--ink-2); }
      .generate-progress {
        font-size: 12px;
        color: var(--ink-3);
      }
      /* Generate status card in context pane */
      .gen-status-card {
        margin: 12px 12px 0;
        padding: 12px 14px;
      }

      /* Block detail panel */
      .block-detail-panel {
        flex: 1;
        overflow-y: auto;
        padding: 24px 28px;
      }
      .block-detail-empty {
        color: var(--ink-4);
        font-size: 13px;
        padding: 20px 0;
      }
      .block-detail-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--ink);
        margin: 0 0 20px;
        line-height: 1.4;
      }
      .block-detail-section {
        margin-bottom: 20px;
      }
      .block-detail-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--ink-4);
        margin: 0 0 8px;
      }
      .block-detail-req-box {
        font-size: 13px;
        color: var(--ink-2);
        line-height: 1.7;
        padding: 12px 14px;
        background: var(--bg-2);
        border-radius: 8px;
        white-space: pre-wrap;
      }
      .block-detail-points {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .block-detail-points li {
        font-size: 13px;
        color: var(--ink-2);
        line-height: 1.6;
        padding: 8px 12px 8px 34px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        position: relative;
      }
      .block-detail-points li::before {
        content: '·';
        position: absolute;
        left: 14px;
        color: var(--accent);
        font-weight: 700;
        font-size: 16px;
        line-height: 1.4;
      }
      .block-detail-points.reject li {
        background: #fff8f7;
        border-color: #ffd5d0;
        color: #7a2020;
      }
      .block-detail-points.reject li::before {
        content: '✕';
        color: #cf1322;
        font-size: 12px;
        left: 12px;
        line-height: 1.7;
      }
      .block-detail-points.bonus li {
        background: #f6ffed;
        border-color: #b7eb8f;
        color: #2d6a0d;
      }
      .block-detail-points.bonus li::before {
        content: '▲';
        color: #389e0d;
        font-size: 11px;
        left: 12px;
        line-height: 1.8;
      }
      /* Gen status card */
      .gen-status-card {
        margin: 12px 12px 0;
        padding: 12px 14px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      /* Numbered module headers */
      .block-detail-module-header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 10px;
      }
      .block-detail-num {
        font-size: 22px;
        font-weight: 700;
        color: var(--ink-4);
        font-family: "SF Mono", ui-monospace, monospace;
        flex: 0 0 auto;
        line-height: 1;
      }
      .block-detail-module-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
      }
      .gen-status-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0 0 8px;
      }
      .gen-status-bar-wrap {
        height: 4px;
        background: var(--line);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .gen-status-bar {
        height: 100%;
        background: var(--accent);
        border-radius: 2px;
        transition: width 0.3s ease;
        width: 0%;
      }
      .gen-status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .gen-status-pct {
        font-size: 11px;
        color: var(--ink-3);
      }
      .gen-status-cancel {
        font-size: 11px;
        color: var(--ink-3);
        background: none;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 2px 8px;
        cursor: pointer;
        font: inherit;
      }
      .gen-status-cancel:hover { color: var(--ink); border-color: var(--ink-3); }
      .tiptap-shell {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 28px 0 80px;
      }
      .tiptap-inner {
        width: min(860px, calc(100% - 48px));
        margin: 0 auto;
      }

      /* ── 正文编辑器卡 ── */
      .content-editor-card {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        height: 100%;
        min-height: 400px;
      }
      .ced-header {
        flex: 0 0 auto;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line-2);
        background: linear-gradient(180deg, #fafaf7, #ffffff);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ced-step-badge {
        display: inline-grid;
        place-items: center;
        width: 22px; height: 22px;
        border-radius: 6px;
        background: var(--ink);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        font-family: "SF Mono", ui-monospace, monospace;
        flex: none;
      }
      .ced-title {
        margin: 0;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--ink);
      }
      .ced-auto-badge {
        font-size: 11px;
        color: var(--ink-3);
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--surface-2);
        border: 1px solid var(--line);
      }
      .ced-save-time {
        font-size: 11px;
        color: var(--ink-4);
        font-family: "SF Mono", ui-monospace, monospace;
      }
      /* AI 生成 Banner */
      .ced-gen-banner {
        flex: 0 0 auto;
        padding: 8px 14px;
        background: oklch(0.96 0.025 256);
        border-bottom: 1px solid oklch(0.88 0.05 256);
        display: none;
        align-items: center;
        gap: 10px;
      }
      .ced-gen-banner.visible { display: flex; }
      .ced-gen-spinner {
        width: 11px; height: 11px;
        border-radius: 50%;
        border: 2px solid oklch(0.88 0.05 256);
        border-top-color: var(--accent);
        animation: spin 0.85s linear infinite;
        flex: none;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .ced-gen-label { font-size: 12.5px; font-weight: 600; color: oklch(0.38 0.13 256); }
      .ced-gen-stage { font-size: 12px; color: oklch(0.38 0.13 256); opacity: 0.75; }
      .ced-gen-progress-track {
        flex: 1; max-width: 240px;
        height: 3px; background: oklch(0.88 0.05 256);
        border-radius: 999px; overflow: hidden;
      }
      .ced-gen-progress-bar {
        height: 100%; background: var(--accent);
        border-radius: 999px; width: 0%;
        transition: width 0.3s;
      }
      .ced-gen-pct {
        font-size: 11.5px; font-weight: 700;
        color: oklch(0.38 0.13 256);
        font-family: "SF Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      .ced-gen-stop {
        all: unset; cursor: pointer;
        padding: 3px 10px; border-radius: 5px;
        font-size: 11.5px; font-weight: 600;
        color: oklch(0.38 0.13 256);
        border: 1px solid oklch(0.88 0.05 256);
        background: #fff;
        flex: none;
      }
      /* 工具栏 */
      .ced-toolbar {
        flex: 0 0 auto;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line-2);
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ced-toolbar-group {
        display: flex;
        gap: 1px;
        padding: 2px;
        background: var(--surface-2);
        border-radius: 7px;
      }
      .ced-fmt-btn {
        all: unset;
        cursor: pointer;
        width: 26px; height: 26px;
        border-radius: 5px;
        display: grid; place-items: center;
        font-size: 12.5px;
        color: var(--ink-2);
        transition: background 0.1s;
      }
      .ced-fmt-btn:hover { background: var(--line-2); }
      .ced-fmt-label-btn {
        all: unset;
        cursor: pointer;
        padding: 0 8px; height: 26px;
        border-radius: 5px;
        display: inline-flex; align-items: center;
        font-size: 11.5px; font-weight: 600;
        color: var(--ink-2);
        transition: background 0.1s;
      }
      .ced-fmt-label-btn:hover { background: var(--line-2); }
      .ced-divider { width: 1px; height: 18px; background: var(--line); flex: none; }
      .ced-wordlimit-wrap {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px 3px 12px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 12px;
        color: var(--ink-3);
      }
      .ced-wordlimit-input {
        all: unset;
        width: 52px;
        font-size: 12.5px; font-weight: 700;
        color: var(--ink);
        text-align: right;
        font-family: "SF Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .ced-wordlimit-cur {
        font-size: 11px;
        font-family: "SF Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
        color: var(--ink-3);
        transition: color 0.15s;
      }
      .ced-wordlimit-cur.over { color: var(--danger); }
      .ced-tone-group {
        display: flex;
        gap: 1px; padding: 2px;
        background: var(--surface-2);
        border-radius: 999px;
      }
      .ced-tone-btn {
        all: unset;
        cursor: pointer;
        padding: 4px 10px; border-radius: 999px;
        font-size: 11.5px; font-weight: 500;
        color: var(--ink-3);
        transition: background 0.12s, color 0.12s;
      }
      .ced-tone-btn.active {
        background: var(--ink);
        color: #fff;
        font-weight: 700;
      }
      .btn-ai-gen {
        all: unset;
        cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 12px; border-radius: 8px;
        background: var(--accent); color: #fff;
        font-size: 12.5px; font-weight: 600;
        box-shadow: 0 6px 14px -6px oklch(0.55 0.16 256 / 0.5);
        transition: opacity 0.1s;
      }
      .btn-ai-gen:hover { opacity: 0.88; }
      /* 编辑区 */
      .ced-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 32px 32px;
        background: var(--surface);
        position: relative;
        min-height: 200px;
      }
      .ced-placeholder {
        font-size: 14px;
        color: var(--ink-4);
        line-height: 1.85;
        font-style: italic;
        pointer-events: none;
        user-select: none;
      }
      .ced-editable {
        outline: none;
        font-size: 14px;
        color: var(--ink);
        line-height: 1.85;
        white-space: pre-wrap;
        min-height: 100%;
      }
      /* AI 提示卡 */
      .ced-ai-hint {
        position: absolute;
        top: 16px; right: 28px;
        width: 220px;
        background: linear-gradient(180deg, oklch(0.96 0.025 256), #fff);
        border: 1px solid oklch(0.88 0.05 256);
        border-radius: 10px;
        padding: 11px 13px;
        display: flex; flex-direction: column; gap: 8px;
        box-shadow: 0 10px 20px -14px rgba(20,40,90,0.18);
      }
      .ced-ai-hint-title {
        display: flex; align-items: center; gap: 6px;
        font-size: 12.5px; font-weight: 700;
        color: oklch(0.38 0.13 256);
      }
      .ced-ai-hint-desc {
        font-size: 11px; color: var(--ink-3); line-height: 1.6;
      }
      .ced-ai-hint-btn {
        all: unset;
        cursor: pointer;
        padding: 5px 10px; border-radius: 6px;
        background: var(--accent); color: #fff;
        font-size: 11.5px; font-weight: 600;
        display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      }
      /* 底栏 */
      .ced-footer {
        flex: 0 0 auto;
        padding: 9px 14px;
        border-top: 1px solid var(--line-2);
        background: var(--surface-2);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .ced-footer-wordcount {
        font-family: "SF Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .ced-footer-btn {
        all: unset;
        cursor: pointer;
        padding: 5px 11px; border-radius: 7px;
        border: 1px solid var(--line);
        background: var(--surface);
        font-size: 12px; color: var(--ink-2);
        transition: background 0.1s;
      }
      .ced-footer-btn:hover { background: var(--bg-2); }
      .ced-footer-save {
        all: unset;
        cursor: pointer;
        padding: 5px 13px; border-radius: 7px;
        background: var(--ink); color: #fff;
        font-size: 12px; font-weight: 600;
      }

      /* Context pane */
      .context-pane {
        width: 300px;
        flex: 0 0 300px;
        background: var(--panel-soft);
        border-left: 1px solid var(--line);

        flex-direction: column;
        height: calc(100vh - 64px);
        overflow-y: auto;
        overflow-x: hidden;

      .context-section {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .context-section:last-child { border-bottom: 0; }

      .context-label {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--ink-4);
        font-family: "SF Mono", ui-monospace, monospace;
        margin: 0;

      .context-content {
        font-size: 12.5px;
        color: var(--ink-2);
        line-height: 1.55;
      }

      .context-req-block {
        padding: 8px 10px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-soft-border);
        border-radius: 7px;
        font-size: 12px;
        color: var(--accent-ink);
        line-height: 1.6;
      }

      .context-sources-list {
        display: flex;
        flex-direction: column;
        gap: 5px;

        padding: 7px 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        font-size: 11.5px;
        color: var(--ink-2);
        line-height: 1.5;
      }
      .context-source-name {
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 2px;
      }

      /* AI action section */
      .ai-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .ai-section-header h4 {
        margin: 0;
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--ink-4);
        font-family: "SF Mono", ui-monospace, monospace;
      }
      .ai-toggle {
        position: relative;
        width: 28px;
        height: 16px;
        border: 0;
        border-radius: 999px;
        background: #0f9f6e;
        cursor: pointer;
        padding: 0;
        flex: none;
      }
      .ai-toggle i {
        position: absolute;
        top: 2px;
        left: 14px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0,0,0,.2);
      }

      .ai-action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }
      .ai-action-btn {
        all: unset;
        cursor: pointer;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-2);
        background: var(--surface);
        text-align: center;
        transition: background 0.1s;
      }
      .ai-action-btn:hover { background: var(--bg-2); }

      /* AI suggestion */
      .ai-suggestion {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .ai-suggestion-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink);
        margin: 0 0 5px;
      }
      .ai-suggestion-text {
        font-size: 12px;
        line-height: 1.55;
        color: var(--ink-2);
        margin: 0 0 8px;
      }
      .suggestion-actions {
        display: flex;
        gap: 5px;
      }
      .suggestion-btn {
        all: unset;
        cursor: pointer;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink-2);
        background: var(--surface);

      .suggestion-btn.accept {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .suggestion-btn.accept:hover { background: var(--ink-2); }

      /* History */
      .history-item {
        display: flex;

    <script type="module">
      import { GenerateSession } from './assets/generate-session.js';
      import { initContextPanel } from './assets/context-panel.js';
      initContextPanel();

      const params = new URLSearchParams(location.search);
      const projectId = params.get('projectId');

      // Tab links
      document.getElementById('tab-init').href = `/project-init?projectId=${projectId}`;
      document.getElementById('tab-review').href = `/diff-review?projectId=${projectId}`;

      let session = null;
      let total = 0;
      let doneCount = 0;

      const btnGen = document.getElementById('btn-generate-all');
      const progress = document.getElementById('generate-progress');
      const genCard = document.getElementById('gen-status-card');
      const genTitle = document.getElementById('gen-status-title');
      const genBar = document.getElementById('gen-status-bar');
      const genPct = document.getElementById('gen-status-pct');
      const genCancel = document.getElementById('gen-status-cancel');

      function updateGenCard(title, index, total) {
        const pct = total > 0 ? Math.round((index / total) * 100) : 0;
        genTitle.textContent = title || '—';
        genBar.style.width = pct + '%';
        genPct.textContent = pct + '%';
      }

      genCancel.addEventListener('click', () => { if (session?.running) session.stop(); });

      window.addEventListener('session:start', e => {
        total = e.detail.total || 0;
        btnGen.textContent = '■ 停止';
        progress.hidden = false;
        progress.textContent = `0 / ${total}`;
        genCard.hidden = false;
        updateGenCard('', 0, total);
      });

      window.addEventListener('block:start', e => {
        const { title = '', index = 0 } = e.detail;
        updateGenCard(title, index, total);
        if (progress) progress.textContent = `${index} / ${total}`;
      });

      window.addEventListener('block:done', () => {
        doneCount++;
        if (progress) progress.textContent = `${doneCount} / ${total}`;
        updateGenCard(genTitle.textContent, doneCount, total);
      });

      window.addEventListener('session:done', () => {
        btnGen.innerHTML = '✦ 批量编写';
        progress.hidden = true;
        doneCount = 0;
        session = null;
        genCard.hidden = true;
      });

      btnGen.addEventListener('click', () => {
        if (session?.running) { session.stop(); return; }
        doneCount = 0;
        session = new GenerateSession(projectId);
        session.start();
      });

      // ── 编辑器数据绑定 ──────────────────────────────────────────────
      let currentBlock = null;
      let editorGenerating = false;
      // blockId → 最新内容（批量生成后同步）
      const blockContentCache = new Map();

      // 暴露 selectBlock 到全局供 workbench.js 调用
      window.__onBlockSelected = function(b) {
        currentBlock = b;
        showEditorWorkspace(b);
      };

      function escHtml(s) {
        return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      function showEditorWorkspace(b) {
        // 显示标题头 + 工作区
        document.getElementById('section-header').style.display = 'flex';
        document.getElementById('editor-empty-hint').style.display = 'none';
        const ws = document.getElementById('editor-workspace');
        ws.style.display = 'flex';

        // 面包屑
        const bc = document.querySelector('[data-breadcrumb]');
        if (bc) bc.textContent = b.parent_title ? `${b.parent_title} › ${b.title}` : (b.title || '');

        // 标题
        const sTitle = document.getElementById('section-title');
        if (sTitle) sTitle.textContent = b.title || '—';

        // 渲染折叠卡
        renderRefCards(b);

        // 编辑器内容：优先使用缓存（批量生成后已更新），其次用 block.content
        const editable = document.getElementById('ced-editable');
        const placeholder = document.getElementById('ced-placeholder');
        const hint = document.getElementById('ced-ai-hint');
        const content = (blockContentCache.has(b.id) ? blockContentCache.get(b.id) : (b.content || '')).trim();
        // 先全部重置，再按内容状态设置
        editable.style.display = 'none';
        editable.textContent = '';
        placeholder.style.display = '';
        if (hint) hint.style.display = 'flex';
        if (content) {
          editable.textContent = content;
          editable.style.display = '';
          placeholder.style.display = 'none';
          if (hint) hint.style.display = 'none';
        }
        updateWordCount();

        // 保存时间
        document.getElementById('ced-save-time').textContent =
          b.updated_at ? `已保存 · ${new Date(b.updated_at).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}` : '—';
      }

      function renderRefCards(b) {
        let score = {};
        try { score = JSON.parse(b.score || '{}'); } catch {}
        const keyPoints = score.key_points || [];
        const hardConstraints = score.hard_constraints || [];
        const specialMarks = (score.special_marks || []).filter(t =>
          t.includes('加分') || t.includes('▲') || (!t.includes('否') && !t.includes('✕'))
        );

        // 应标要求
        const reqBody = document.getElementById('ref-req-body');
        if (reqBody) reqBody.innerHTML = b.requirement
          ? `<p style="margin:0;">${escHtml(b.requirement)}</p>`
          : `<p style="margin:0;color:var(--ink-4);font-style:italic;">暂无应标要求</p>`;

        // 应标重点
        const focusBody = document.getElementById('ref-focus-body');
        const focusCount = document.getElementById('ref-focus-count');
        if (focusCount) focusCount.textContent = keyPoints.length || '';
        if (focusBody) focusBody.innerHTML = keyPoints.length
          ? `<ul class="ref-bullet-list">${keyPoints.map((t,i)=>`<li><span class="ref-bullet-num" style="color:oklch(0.62 0.16 75);">${String(i+1).padStart(2,'0')}</span><span>${escHtml(t)}</span></li>`).join('')}</ul>`
          : `<p style="margin:0;color:var(--ink-4);font-style:italic;">暂无应标重点</p>`;

        // 否决项
        const vetoBody = document.getElementById('ref-veto-body');
        const vetoCount = document.getElementById('ref-veto-count');
        if (vetoCount) vetoCount.textContent = hardConstraints.length || '';
        if (vetoBody) vetoBody.innerHTML = hardConstraints.length
          ? `<ul class="ref-bullet-list">${hardConstraints.map((t,i)=>`<li><span class="ref-bullet-num" style="color:oklch(0.6 0.2 25);">${String(i+1).padStart(2,'0')}</span><span>${escHtml(t)}</span></li>`).join('')}</ul>`
          : `<p style="margin:0;color:var(--ink-4);font-style:italic;">暂无否决项</p>`;

        // 加分项
        const bonusBody = document.getElementById('ref-bonus-body');
        const bonusCount = document.getElementById('ref-bonus-count');
        if (bonusCount) bonusCount.textContent = specialMarks.length || '';
        if (bonusBody) bonusBody.innerHTML = specialMarks.length
          ? `<ul class="ref-bullet-list">${specialMarks.map((t,i)=>`<li><span class="ref-bullet-num" style="color:oklch(0.6 0.15 150);">${String(i+1).padStart(2,'0')}</span><span>${escHtml(t)}</span></li>`).join('')}</ul>`
          : `<p style="margin:0;color:var(--ink-4);font-style:italic;">暂无加分项</p>`;
      }

      // ── 字数统计 ──
      function updateWordCount() {
        const editable = document.getElementById('ced-editable');
        const limitInput = document.getElementById('ced-wordlimit');
        const curEl = document.getElementById('ced-wordlimit-cur');
        const footerWc = document.getElementById('ced-footer-wc');
        const wc = (editable?.innerText || '').replace(/\s/g, '').length;
        const limit = parseInt(limitInput?.value) || 800;
        if (curEl) {
          curEl.textContent = `当前 ${wc}`;
          curEl.classList.toggle('over', wc > limit);
        }
        if (footerWc) footerWc.textContent = `${wc} / ${limit} 字`;
      }

      document.getElementById('ced-editable')?.addEventListener('input', updateWordCount);
      document.getElementById('ced-wordlimit')?.addEventListener('input', updateWordCount);

      // ── 文风切换 ──
      document.querySelectorAll('.ced-tone-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.ced-tone-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const toneNames = { official:'公文文风', tech:'技术文风', concise:'精简文风' };
          const footerModel = document.getElementById('ced-footer-model');
          if (footerModel) footerModel.textContent = `Sonnet 4.6 · ${toneNames[btn.dataset.tone] || '公文文风'}`;
        });
      });

      // ── AI 生成（单块）：POST SSE fetch ──
      async function startSingleGenerate() {
        if (!currentBlock || editorGenerating) return;
        editorGenerating = true;

        const tone = document.querySelector('.ced-tone-btn.active')?.dataset.tone || 'official';
        const targetWords = parseInt(document.getElementById('ced-wordlimit')?.value) || 800;

        const editable = document.getElementById('ced-editable');
        const placeholder = document.getElementById('ced-placeholder');
        const hint = document.getElementById('ced-ai-hint');
        const banner = document.getElementById('ced-gen-banner');
        const pbar = document.getElementById('ced-gen-pbar');
        const pct = document.getElementById('ced-gen-pct');
        const stage = document.getElementById('ced-gen-stage');

        placeholder.style.display = 'none';
        if (hint) hint.style.display = 'none';
        editable.style.display = '';
        editable.textContent = '';
        banner.classList.add('visible');
        let progress = 0;

        const stages = ['· 分析应标要求', '· 匹配原始素材', '· 生成正文内容', '· 整理输出'];
        let stageIdx = 0;
        const stageTimer = setInterval(() => {
          stageIdx = (stageIdx + 1) % stages.length;
          if (stage) stage.textContent = stages[stageIdx];
          progress = Math.min(95, progress + Math.random() * 8 + 2);
          if (pbar) pbar.style.width = progress + '%';
          if (pct) pct.textContent = Math.round(progress) + '%';
        }, 600);

        const abortCtrl = new AbortController();
        document.getElementById('ced-gen-stop')?.addEventListener('click', () => {
          abortCtrl.abort();
        }, { once: true });

        try {
          const resp = await fetch(`/api/blocks/${currentBlock.id}/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tone, target_words: targetWords }),
            signal: abortCtrl.signal,
          });

          if (!resp.ok || !resp.body) {
            finishGenerate(stageTimer, null, banner, pbar, pct);
            return;
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
              if (!line.startsWith('data:')) continue;
              try {
                const data = JSON.parse(line.slice(5).trim());
                if (data.text) editable.textContent += data.text;
                if (data.block_id) finishGenerate(stageTimer, null, banner, pbar, pct);
              } catch {}
            }
          }
        } catch (err) {
          if (err.name !== 'AbortError') console.error('生成失败', err);
        }

        finishGenerate(stageTimer, null, banner, pbar, pct);
      }

      function finishGenerate(stageTimer, _unused, banner, pbar, pct) {
        clearInterval(stageTimer);
        editorGenerating = false;
        banner.classList.remove('visible');
        if (pbar) pbar.style.width = '100%';
        if (pct) pct.textContent = '100%';
        updateWordCount();
        // 更新保存时间
        document.getElementById('ced-save-time').textContent =
          `已保存 · ${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}`;
      }

      document.getElementById('btn-ai-gen')?.addEventListener('click', startSingleGenerate);
      document.getElementById('btn-ai-hint-gen')?.addEventListener('click', startSingleGenerate);

      // ── block:token 事件（批量生成流式写入编辑器） ──
      window.addEventListener('block:token', e => {
        const blockId = e.detail.block_id;
        // 累积到缓存
        blockContentCache.set(blockId, (blockContentCache.get(blockId) || '') + e.detail.token);

        if (!currentBlock || blockId !== currentBlock.id) return;
        const editable = document.getElementById('ced-editable');
        if (editable) {
          editable.style.display = '';
          document.getElementById('ced-placeholder').style.display = 'none';
          editable.textContent += e.detail.token;
          updateWordCount();
        }
      });

      // block:done 时确认缓存已有完整内容（token 已累积完毕）
      window.addEventListener('block:done', e => {
        // blockContentCache 已通过 block:token 累积，无需额外处理
        // 若当前显示节点正好是该 block，刷新字数
        if (currentBlock && e.detail.block_id === currentBlock.id) updateWordCount();
      });

      // ── 保存草稿 ──
      document.getElementById('btn-save-draft')?.addEventListener('click', async () => {
        if (!currentBlock) return;
        const editable = document.getElementById('ced-editable');
        if (!editable) return;
        await fetch(`/api/blocks/${currentBlock.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: editable.innerHTML }),
        });
        document.getElementById('ced-save-time').textContent =
          `已保存 · ${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}`;
      });

      // ── Mock 匹配素材 ──
      const MOCK_MATERIALS = [
        { kind:'DOCX', name:'用户画像调研报告 V2.docx', match:92, snippet:'三类核心用户群体的画像与需求矩阵分析…' },
        { kind:'PDF',  name:'AI 产业链分层白皮书.pdf',   match:84, snippet:'AI 终端企业、芯片/OS 厂商、软件开发商分层…' },
        { kind:'PPTX', name:'运营方协同管理方案.pptx',   match:71, snippet:'内容发布 → 审核 → 上架的协同流程设计…' },
        { kind:'DOCX', name:'统一账号体系设计.docx',     match:68, snippet:'跨平台 SSO 与权限模型设计规范…' },
      ];
      const FILE_BADGE_PALETTE = {
        PDF:  { bg:'#fdecec', fg:'#b3261e' },
        DOCX: { bg:'#e8efff', fg:'#1f4ed8' },
        PPTX: { bg:'#fff1e0', fg:'#a35b00' },
      };
      function renderMockMaterials() {
        const list = document.getElementById('mat-list');
        if (!list) return;
        list.innerHTML = MOCK_MATERIALS.map(m => {
          const pal = FILE_BADGE_PALETTE[m.kind] || { bg:'#eee', fg:'#444' };
          const matchColor = m.match >= 85 ? 'var(--success)' : m.match >= 70 ? 'var(--warn)' : 'var(--ink-4)';
          return `<div style="padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:flex;flex-direction:column;gap:5px;cursor:pointer;" onmouseenter="this.style.background='var(--surface-2)'" onmouseleave="this.style.background='var(--surface)'">
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 5px;border-radius:3px;background:${pal.bg};color:${pal.fg};font-family:'SF Mono',ui-monospace,monospace;flex:none;">${m.kind}</span>
              <span style="flex:1;font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(m.name)}">${escHtml(m.name)}</span>
              <span style="display:inline-flex;align-items:center;gap:4px;flex:none;">
                <span style="width:34px;height:4px;background:var(--line-2);border-radius:999px;overflow:hidden;display:inline-block;"><span style="display:block;width:${m.match}%;height:100%;background:${matchColor};border-radius:999px;"></span></span>
                <span style="font-size:10.5px;font-weight:700;color:${matchColor};font-family:'SF Mono',ui-monospace,monospace;">${m.match}</span>
              </span>
            </div>
            <div style="font-size:11.5px;color:var(--ink-3);line-height:1.55;">${escHtml(m.snippet)}</div>
            <div style="display:flex;gap:4px;margin-top:2px;">
              <button style="all:unset;cursor:pointer;padding:2px 8px;border-radius:4px;font-size:11px;color:var(--ink-3);background:var(--surface-2);">查看</button>
              <button style="all:unset;cursor:pointer;padding:2px 8px;border-radius:4px;font-size:11px;color:var(--accent-ink);background:var(--accent-soft);font-weight:600;">+ 引用</button>
            </div>
          </div>`;
        }).join('');
      }
      renderMockMaterials();
    </script>

    <script>
      // 全局辅助：折叠卡切换（inline onclick 调用）
      function toggleRefCard(id) {
        const card = document.getElementById(id);
        if (card) card.classList.toggle('open');
      }
    </script>
  </body>
</html>
