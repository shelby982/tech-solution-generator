<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能应标 · 项目列表</title>
    <link rel="stylesheet" href="./assets/styles.css" />
    <style>
      /* ── 页头 ── */
      .app-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px 28px 0;
      }
      .app-logo {
        width: 40px; height: 40px;
        background: var(--text);
        border-radius: 10px;
        display: grid; place-items: center;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        flex: none;
      }
      .app-header-text h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.2;
      }
      .app-header-text p {
        margin: 0;
        font-size: 12.5px;
        color: var(--muted-2);
      }

      /* ── 列表区 ── */
      .projects-page { padding: 20px 28px 40px; }

      .projects-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .projects-toolbar h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      .btn-new-project {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 18px;
        border-radius: 999px;
        background: var(--text);
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 13.5px;
        font-weight: 600;
      }
      .btn-new-project:hover { opacity: 0.85; }

      /* ── 空状态 ── */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 360px;
        gap: 16px;
        text-align: center;
      }
      .empty-state[hidden] { display: none; }
      .empty-icon {
        width: 64px; height: 64px;
        border-radius: 18px;
        background: var(--bg-2);
        display: grid; place-items: center;
        font-size: 28px;
      }
      .empty-state h3 { margin: 0; font-size: 16px; }
      .empty-state p { margin: 0; color: var(--muted); font-size: 13.5px; }
      .btn-create-first {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 11px 22px;
        border-radius: 999px;
        background: var(--text);
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        margin-top: 4px;
      }
      .btn-create-first:hover { opacity: 0.85; }

      /* ── 项目卡片 ── */
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
      .project-item {
        background: rgba(255,255,255,0.96);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        cursor: pointer;
        transition: box-shadow 0.15s, border-color 0.15s;
        text-decoration: none;
        color: inherit;
      }
      .project-item:hover {
        box-shadow: var(--shadow);
        border-color: var(--line-strong);
      }
      .project-item-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
      .project-item-name {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.3;
        flex: 1;
      }
      .project-status-badge {
        flex: none;
        font-size: 11.5px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 999px;
      }
      .project-status-badge.init   { background: var(--warn-soft);    color: var(--warn); }
      .project-status-badge.auth   { background: var(--success-soft);  color: var(--success); }
      .project-status-badge.review { background: #fff1eb; color: var(--danger); }
      .project-status-badge.done   { background: var(--accent-soft);   color: var(--accent); }

      .project-item-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .project-item-meta span { display: flex; align-items: center; gap: 4px; }

      .project-item-foot {
        padding-top: 14px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12.5px;
        color: var(--muted-2);
      }
      .project-deadline { color: var(--danger); font-weight: 600; }

      /* ── 新建弹窗 ── */
      .modal-backdrop {
        display: none;
        position: fixed; inset: 0;
        background: rgba(15,23,42,0.35);
        backdrop-filter: blur(4px);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      .modal-backdrop.open { display: flex; }

      .modal-box {
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 24px 64px rgba(15,23,42,0.18);
        width: 480px;
        max-width: calc(100vw - 48px);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .modal-header {
        padding: 22px 24px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-header h2 { margin: 0; font-size: 17px; font-weight: 700; }
      .modal-close {
        width: 30px; height: 30px;
        border: none;
        background: var(--bg-2);
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        display: grid; place-items: center;
        color: var(--muted);
      }
      .modal-close:hover { background: var(--line); }

      .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }

      /* 项目名 */
      .field-label {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 6px;
        letter-spacing: 0.3px;
      }
      .field-input {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--panel-soft);
        outline: none;
        transition: border-color 0.15s;
        box-sizing: border-box;
      }
      .field-input:focus { border-color: var(--accent); }

      /* 上传区 */
      .upload-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .upload-section-num {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--muted-2);
      }
      .upload-section-title {
        font-size: 14px;
        font-weight: 700;
      }
      .upload-section-sub {
        font-size: 12px;
        color: var(--muted-2);
        margin-top: 1px;
      }
      .upload-count-badge {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 10px;
      }

      .drop-zone {
        border: 1.5px dashed #c2cfe0;
        border-radius: 14px;
        background: var(--panel-soft);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 28px 16px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
        text-align: center;
      }
      .drop-zone[hidden] { display: none; }
      .drop-zone:hover, .drop-zone.drag-over {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .drop-zone-icon {
        width: 36px; height: 36px;
        border: 1.5px solid var(--line-strong);
        border-radius: 9px;
        display: grid; place-items: center;
        font-size: 18px;
        background: #fff;
        margin-bottom: 4px;
      }
      .drop-zone-label { font-size: 14px; font-weight: 600; }
      .drop-zone-hint { font-size: 12px; color: var(--muted-2); }

      /* 已上传文件列表 */
      .file-list { display: flex; flex-direction: column; gap: 6px; }
      .file-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
      }
      .file-type-badge {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 5px;
        flex: none;
      }
      .file-type-badge.docx { background: #dbeafe; color: #1d4ed8; }
      .file-type-badge.pdf  { background: #fee2e2; color: #b91c1c; }
      .file-type-badge.pptx { background: #fef3c7; color: #92400e; }
      .file-type-badge.default { background: var(--bg-2); color: var(--muted); }
      .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .file-size { color: var(--muted-2); flex: none; }
      .file-remove {
        flex: none;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted-2);
        font-size: 14px;
        padding: 0 2px;
        display: grid; place-items: center;
      }
      .file-remove:hover { color: var(--danger); }
      .file-role-select {
        flex: none;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
        outline: none;
      }
      .file-role-select:hover { border-color: var(--muted); }
      .file-role-select:focus { border-color: var(--accent, #2563eb); }

      .btn-add-more {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px;
        border: 1.5px dashed var(--line);
        border-radius: 10px;
        background: none;
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
        width: 100%;
        transition: border-color 0.15s, color 0.15s;
      }
      .btn-add-more:hover { border-color: var(--text); color: var(--text); }

      /* 底部：模型选择 + 提炼大纲 */
      .modal-footer {
        padding: 0 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--accent-soft);
        border-top: 1px solid #d1e4ff;
        padding-top: 16px;
        margin: 0 0 0 0;
      }
      .modal-footer-inner {
        background: var(--accent-soft);
        border-top: 1px solid #d1e4ff;
        padding: 16px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .btn-distill {
        width: 100%;
        padding: 14px;
        background: var(--text);
        color: #fff;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-distill:hover { opacity: 0.88; }
      .btn-distill:disabled { opacity: 0.5; cursor: default; }

      .footer-hint-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .footer-hint-text {
        font-size: 12px;
        color: var(--accent);
        line-height: 1.5;
        flex: 1;
      }

      /* 模型选择器 */
      .model-selector-wrap { position: relative; }
      .model-selector-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border: 1.5px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .model-selector-btn:hover { border-color: var(--muted); }
      .model-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--text);
        flex: none;
      }
      .model-dropdown {
        display: none;
        position: absolute;
        bottom: calc(100% + 8px);
        right: 0;
        min-width: 200px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
        z-index: 10;
      }
      .model-dropdown.open { display: block; }
      .model-dropdown-header {
        padding: 12px 16px 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .model-list { padding: 6px; }
      .model-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
      }
      .model-option:hover { background: var(--bg-2); }
      .model-option.selected { background: var(--accent-soft); }
      .model-option-check { color: var(--accent); font-size: 14px; }
      .model-dropdown-footer {
        border-top: 1px solid var(--line);
        padding: 8px;
      }
      .btn-add-config {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
        background: none;
        border: none;
        width: 100%;
        font: inherit;
      }
      .btn-add-config:hover { background: var(--bg-2); }
      .btn-add-config-left { display: flex; align-items: center; gap: 8px; }
      .btn-add-config-plus {
        width: 22px; height: 22px;
        border: 1.5px solid var(--line-strong);
        border-radius: 6px;
        display: grid; place-items: center;
        font-size: 13px;
        color: var(--muted);
      }
      .btn-add-config-api {
        font-size: 11.5px;
        color: var(--muted-2);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* ── API 配置弹窗 ── */
      .api-modal-backdrop {
        display: none;
        position: fixed; inset: 0;
        background: rgba(15,23,42,0.45);
        backdrop-filter: blur(4px);
        z-index: 200;
        align-items: center;
        justify-content: center;
      }
      .api-modal-backdrop.open { display: flex; }
      .api-modal-box {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 30px 60px rgba(15,23,42,0.22);
        width: 480px;
        max-width: calc(100vw - 48px);
        overflow: hidden;
      }
      .api-modal-header {
        padding: 18px 22px 14px;
        border-bottom: 1px solid var(--line);
        display: flex; align-items: flex-start; justify-content: space-between;
      }
      .api-modal-header h2 { margin: 0; font-size: 16px; font-weight: 700; }
      .api-modal-header p  { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
      .api-modal-close {
        all: unset; cursor: pointer; padding: 4px 6px; border-radius: 6px;
        color: var(--muted-2); font-size: 14px; line-height: 1;
      }
      .api-modal-close:hover { background: var(--bg-2); }
      .api-modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }

      .api-field-label { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
      .api-field-hint  { font-size: 11px; color: var(--muted-2); margin-top: 4px; }
      .api-input {
        width: 100%; box-sizing: border-box;
        padding: 9px 11px;
        background: var(--panel-soft);
        border: 1.5px solid var(--line);
        border-radius: 9px;
        font: inherit; font-size: 13px; color: var(--text);
        outline: none; transition: border-color 0.15s;
      }
      .api-input:focus { border-color: var(--accent); }
      .api-input.mono { font-family: 'SF Mono', ui-monospace, monospace; font-size: 12.5px; }

      .provider-chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .provider-chip {
        padding: 5px 12px; border-radius: 999px;
        border: 1.5px solid var(--line);
        background: #fff; cursor: pointer;
        font: inherit; font-size: 12.5px; font-weight: 500;
        color: var(--muted); transition: all 0.12s;
      }
      .provider-chip.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }

      .key-wrap { position: relative; }
      .key-toggle {
        all: unset; cursor: pointer;
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        font-size: 11px; color: var(--muted-2);
        padding: 3px 6px; border-radius: 4px;
      }
      .key-toggle:hover { color: var(--text); background: var(--bg-2); }

      .api-modal-footer {
        padding: 13px 22px;
        border-top: 1px solid var(--line);
        background: var(--panel-soft);
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
      }
      .btn-test-conn {
        all: unset; cursor: pointer;
        padding: 8px 12px; border-radius: 8px;
        font: inherit; font-size: 12.5px; color: var(--muted);
        display: flex; align-items: center; gap: 5px;
        border: 1px solid var(--line); background: #fff;
        transition: all 0.12s;
      }
      .btn-test-conn:hover { border-color: var(--muted); color: var(--text); }
      .btn-test-conn.testing { opacity: 0.6; pointer-events: none; }
      .test-status { font-size: 12px; }
      .test-status.ok   { color: var(--success); }
      .test-status.fail { color: var(--danger); }

      .api-footer-right { display: flex; gap: 8px; }
      .btn-api-cancel {
        padding: 9px 16px; border-radius: 9px;
        border: 1.5px solid var(--line); background: #fff;
        font: inherit; font-size: 13px; font-weight: 500;
        color: var(--muted); cursor: pointer;
      }
      .btn-api-save {
        padding: 9px 16px; border-radius: 9px;
        border: none; background: var(--text);
        font: inherit; font-size: 13px; font-weight: 600;
        color: #fff; cursor: pointer;
      }
      .btn-api-save:disabled { opacity: 0.45; cursor: default; }
      .btn-api-save:not(:disabled):hover { opacity: 0.88; }
    </style>
  </head>
  <body>
    <!-- 页头 -->
    <div class="app-header">
      <div class="app-logo">标</div>
      <div class="app-header-text">
        <h1>智能应标</h1>
        <p>AI 驱动的投标方案生成工具</p>
      </div>
    </div>

    <!-- 列表区 -->
    <div class="projects-page">
      <div class="projects-toolbar">
        <h2>我的项目</h2>
        <button class="btn-new-project" id="btn-new-project">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M6.5 1.5V11.5M1.5 6.5H11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          新建项目
        </button>
      </div>

      <!-- 空状态（有项目时隐藏） -->
      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-icon">📋</div>
        <h3>还没有项目</h3>
        <p>新建项目，上传应标文件开始生成方案</p>
        <button class="btn-create-first" id="btn-create-first">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M6.5 1.5V11.5M1.5 6.5H11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          新建第一个项目
        </button>
      </div>

      <!-- 项目网格 -->
      <div class="projects-grid" id="projects-grid"></div>
    </div>

    <!-- 新建项目弹窗 -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-box" id="modal-box">
        <div class="modal-header">
          <h2>新建项目</h2>
          <button class="modal-close" id="modal-close">✕</button>
        </div>

        <div class="modal-body">
          <!-- 项目名称 -->
          <div>
            <div class="field-label">项目名称</div>
            <input type="text" class="field-input" id="project-name-input" placeholder="输入项目名称" />
          </div>

          <!-- 应标要求上传 -->
          <div>
            <div class="upload-section-header">
              <div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <span class="upload-section-num">01</span>
                  <span class="upload-section-title">应标要求</span>
                </div>
                <div class="upload-section-sub">应答文件技术部分 · 技术规范书</div>
              </div>
              <span class="upload-count-badge" id="req-count-badge" hidden>0 项</span>
            </div>

            <!-- 空状态：拖拽区 -->
            <div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="添加应标要求">
              <div class="drop-zone-icon">＋</div>
              <div class="drop-zone-label">添加应标要求</div>
              <div class="drop-zone-hint">点击或拖拽文件到此处</div>
            </div>

            <!-- 有文件：文件列表 -->
            <div id="req-file-section" hidden>
              <div class="file-list" id="req-file-list"></div>
              <button class="btn-add-more" id="btn-add-more" style="margin-top:6px;">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                  <path d="M6 1V11M1 6H11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                添加应标要求
              </button>
            </div>
          </div>
        </div>

        <!-- 底部：提炼大纲 + 模型选择 -->
        <div class="modal-footer-inner">
          <button class="btn-distill" id="btn-distill" disabled>
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
              <path d="M7 1L8.2 5.3L12.5 6.5L8.2 7.7L7 12L5.8 7.7L1.5 6.5L5.8 5.3L7 1Z" fill="currentColor"/>
            </svg>
            提炼大纲
          </button>
          <div class="footer-hint-row">
            <p class="footer-hint-text">依据应标要求生成章节结构，原始素材用于补充各模块内容</p>
            <div class="model-selector-wrap">
              <button class="model-selector-btn" id="model-selector-btn">
                <span class="model-dot"></span>
                <span id="model-selector-label">Sonnet 4.6</span>
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                  <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </button>
              <div class="model-dropdown" id="model-dropdown">
                <div class="model-dropdown-header">选择模型</div>
                <div class="model-list" id="model-list"></div>
                <div class="model-dropdown-footer">
                  <button class="btn-add-config" id="btn-add-config">
                    <span class="btn-add-config-left">
                      <span class="btn-add-config-plus">＋</span>
                      添加配置
                    </span>
                    <span class="btn-add-config-api">API · KEY ›</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 隐藏 file input -->
    <input type="file" id="file-input-req" accept=".pdf,.docx,.doc,.pptx,.ppt" multiple style="display:none" />

    <!-- API 配置弹窗 -->
    <div class="api-modal-backdrop" id="api-modal-backdrop">
      <div class="api-modal-box">
        <div class="api-modal-header">
          <div>
            <h2>添加模型配置</h2>
            <p>添加新的 API 配置以在模型菜单中使用</p>
          </div>
          <button class="api-modal-close" id="api-modal-close">✕</button>
        </div>
        <div class="api-modal-body">
          <!-- 提供商 -->
          <div>
            <div class="api-field-label">API 提供商</div>
            <div class="provider-chips" id="provider-chips">
              <button class="provider-chip active" data-provider="claude">Anthropic</button>
              <button class="provider-chip" data-provider="openai">OpenAI</button>
              <button class="provider-chip" data-provider="deepseek">DeepSeek</button>
              <button class="provider-chip" data-provider="kimi">Kimi</button>
              <button class="provider-chip" data-provider="minimax">MiniMax</button>
              <button class="provider-chip" data-provider="doubao">豆包</button>
            </div>
          </div>
          <!-- Base URL -->
          <div>
            <div class="api-field-label">Base URL</div>
            <input class="api-input" id="api-base-url" placeholder="留空则使用提供商默认地址" />
            <div class="api-field-hint">留空则使用提供商默认地址</div>
          </div>
          <!-- API Key -->
          <div>
            <div class="api-field-label">API Key</div>
            <div class="key-wrap">
              <input class="api-input mono" id="api-key" type="password" placeholder="sk-ant-…" />
              <button class="key-toggle" id="key-toggle">显示</button>
            </div>
            <div class="api-field-hint">密钥仅保存在本地，不会上传</div>
          </div>
          <!-- 模型标识 -->
          <div>
            <div class="api-field-label">模型标识</div>
            <input class="api-input" id="api-model" placeholder="例如 claude-sonnet-4-6 或 gpt-4o" />
            <div class="api-field-hint">例如 claude-sonnet-4-6、gpt-4o、deepseek-chat</div>
          </div>
        </div>
        <div class="api-modal-footer">
          <div style="display:flex;align-items:center;gap:10px;">
            <button class="btn-test-conn" id="btn-test-conn">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/>
                <path d="M6 7.5V6.5C7 6.5 7.5 6 7.5 5.2C7.5 4.4 6.9 4 6 4C5.2 4 4.6 4.5 4.5 5.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                <circle cx="6" cy="9" r="0.5" fill="currentColor"/>
              </svg>
              验证连接
            </button>
            <span class="test-status" id="test-status"></span>
          </div>
          <div class="api-footer-right">
            <button class="btn-api-cancel" id="btn-api-cancel">取消</button>
            <button class="btn-api-save" id="btn-api-save" disabled>添加</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { api } from './assets/api.js?v=20260917-loop6';

      // ── 状态 ──
      const reqFiles = []; // {file, name, size, ext}
      let selectedModel = 'claude-sonnet-4-6';
      let selectedModelLabel = 'Sonnet 4.6';
      let createdProjectId = null;

      // ── DOM ──
      const backdropEl   = document.getElementById('modal-backdrop');
      const modalClose   = document.getElementById('modal-close');
      const btnNew       = document.getElementById('btn-new-project');
      const btnFirst     = document.getElementById('btn-create-first');
      const nameInput    = document.getElementById('project-name-input');
      const dropZone     = document.getElementById('drop-zone');
      const fileInput    = document.getElementById('file-input-req');
      const reqSection   = document.getElementById('req-file-section');
      const reqFileList  = document.getElementById('req-file-list');
      const reqCountBadge= document.getElementById('req-count-badge');
      const btnAddMore   = document.getElementById('btn-add-more');
      const btnDistill   = document.getElementById('btn-distill');
      const modelBtn     = document.getElementById('model-selector-btn');
      const modelLabel   = document.getElementById('model-selector-label');
      const modelDropdown= document.getElementById('model-dropdown');
      const modelListEl  = document.getElementById('model-list');
      const emptyState   = document.getElementById('empty-state');
      const projectsGrid = document.getElementById('projects-grid');

      // ── 项目列表 ──
      const STATUS_MAP = {
        init:      ['init',   '初始化中'],
        authoring: ['auth',   '内容生产'],
        reviewing: ['review', '待审核'],
        done:      ['done',   '已完成'],
      };

      function formatDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return `${d.getMonth()+1}-${String(d.getDate()).padStart(2,'0')}`;
      }

      function renderCard(p) {
        const [cls, label] = STATUS_MAP[p.status] || ['init', p.status];
        const created = formatDate(p.created_at);
        return `
          <a class="project-item" href="#" data-project-id="${p.id}">
            <div class="project-item-top">
              <div class="project-item-name">${escHtml(p.name)}</div>
              <span class="project-status-badge ${cls}">${label}</span>
            </div>
            <div class="project-item-meta">
              <span>创建 ${created || '—'}</span>
              ${p.deadline ? `<span class="project-deadline">截止 ${escHtml(p.deadline)}</span>` : ''}
            </div>
            <div class="project-item-foot">
              <span>ID ${p.id}</span>
              <span>›</span>
            </div>
          </a>`;
      }

      function escHtml(s) {
        return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      async function navigateToProject(projectId) {
        // 根据该项目最新 workflow_run 的 stage 决定跳到哪个页面
        let thread = null;
        try {
          const runs = await fetch(`/api/projects/${projectId}/workflow-runs`).then(r => r.ok ? r.json() : []);
          thread = Array.isArray(runs) && runs.length ? runs[0] : null;
        } catch {}

        if (!thread || !thread.thread_id) {
          location.href = `/project-init?projectId=${projectId}`;
          return;
        }
        const tid = thread.thread_id;
        const stage = thread.stage;
        const enc = encodeURIComponent(tid);

        // 跳转前把 backend stage 持久化到 sessionStorage，让目标页面初次 renderStageBar
        // 时能立即点亮"项目当前所处阶段"为蓝色 active，与 backend 真实 stage 对齐。
        // 否则目标页面要等异步 state API / workflow-runs 返回才能校准颜色。
        try {
          if (stage) sessionStorage.setItem(`furthestStage:${projectId}`, stage);
          sessionStorage.setItem(`workflow:${projectId}`, tid);
        } catch {}

        const backendQ = stage ? `&backend=${encodeURIComponent(stage)}` : '';
        switch (stage) {
          case 'idle':
          case 'parsing':
          case 'outline_review':
          case 'matching':
          case 'materials_review':
            location.href = `/project-init?projectId=${projectId}&threadId=${enc}${backendQ}`;
            break;
          case 'generating':
            location.href = `/workbench?projectId=${projectId}&threadId=${enc}${backendQ}`;
            break;
          case 'reviewing':
          case 'report_review':
          case 'done':
            location.href = `/review?threadId=${enc}${backendQ}`;
            break;
          case 'aborted':
          default:
            location.href = `/project-init?projectId=${projectId}`;
        }
      }

      async function loadProjects() {
        const projects = await api.projects.list();
        if (!projects?.length) {
          emptyState.hidden = false;
          projectsGrid.innerHTML = '';
        } else {
          emptyState.hidden = true;
          projectsGrid.innerHTML = projects.map(renderCard).join('');
          projectsGrid.querySelectorAll('.project-item[data-project-id]').forEach(el => {
            el.addEventListener('click', (e) => {
              e.preventDefault();
              navigateToProject(parseInt(el.dataset.projectId, 10));
            });
          });
        }
      }

      // ── 弹窗开关 ──
      function openModal() {
        reqFiles.length = 0;
        nameInput.value = '';
        createdProjectId = null;
        renderFileList();
        updateDistillBtn();
        backdropEl.classList.add('open');
        setTimeout(() => nameInput.focus(), 80);
      }
      function closeModal() {
        backdropEl.classList.remove('open');
        modelDropdown.classList.remove('open');
      }

      btnNew.addEventListener('click', openModal);
      btnFirst?.addEventListener('click', openModal);
      modalClose.addEventListener('click', closeModal);
      backdropEl.addEventListener('click', e => { if (e.target === backdropEl) closeModal(); });

      // ── 文件上传 ──
      function extOf(name) {
        return (name.split('.').pop() || '').toLowerCase();
      }
      function fmtSize(bytes) {
        if (bytes >= 1024*1024) return (bytes/(1024*1024)).toFixed(1) + ' MB';
        return (bytes/1024).toFixed(0) + ' KB';
      }
      function addFiles(fileList) {
        for (const f of fileList) {
          reqFiles.push({ file: f, name: f.name, size: f.size, ext: extOf(f.name), role: 'spec' });
        }
        renderFileList();
        updateDistillBtn();
      }
      function removeFile(idx) {
        reqFiles.splice(idx, 1);
        renderFileList();
        updateDistillBtn();
      }

      function renderFileList() {
        const hasFiles = reqFiles.length > 0;
        dropZone.hidden = hasFiles;
        reqSection.hidden = !hasFiles;
        if (hasFiles) {
          reqCountBadge.hidden = false;
          reqCountBadge.textContent = reqFiles.length + ' 项';
          reqFileList.innerHTML = reqFiles.map((f, i) => `
            <div class="file-row">
              <span class="file-type-badge ${f.ext || 'default'}">${f.ext.toUpperCase() || 'FILE'}</span>
              <span class="file-name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
              <select class="file-role-select" data-idx="${i}" title="文件类型">
                <option value="spec" ${f.role === 'spec' ? 'selected' : ''}>规范书</option>
                <option value="main_rfp" ${f.role === 'main_rfp' ? 'selected' : ''}>主招标文件</option>
                <option value="scoring" ${f.role === 'scoring' ? 'selected' : ''}>评分表</option>
                <option value="evaluation" ${f.role === 'evaluation' ? 'selected' : ''}>评审要素</option>
              </select>
              <span class="file-size">${fmtSize(f.size)}</span>
              <button class="file-remove" data-idx="${i}" title="移除">✕</button>
            </div>`).join('');
          reqFileList.querySelectorAll('.file-remove').forEach(btn => {
            btn.addEventListener('click', () => removeFile(+btn.dataset.idx));
          });
          reqFileList.querySelectorAll('.file-role-select').forEach(sel => {
            sel.addEventListener('change', () => {
              const idx = +sel.dataset.idx;
              if (reqFiles[idx]) reqFiles[idx].role = sel.value;
            });
          });
        } else {
          reqCountBadge.hidden = true;
        }
      }

      function updateDistillBtn() {
        const hasName = nameInput.value.trim().length > 0;
        const hasFiles = reqFiles.length > 0;
        btnDistill.disabled = !(hasName && hasFiles);
      }

      // 拖拽
      dropZone.addEventListener('click', () => fileInput.click());
      dropZone.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') fileInput.click(); });
      dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
      dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        addFiles(e.dataTransfer.files);
      });

      fileInput.addEventListener('change', () => {
        addFiles(fileInput.files);
        fileInput.value = '';
      });

      btnAddMore.addEventListener('click', () => fileInput.click());
      nameInput.addEventListener('input', updateDistillBtn);

      // ── 模型选择 ──
      async function loadModels() {
        try {
          const resp = await fetch('/api/configs').then(r => r.json());
          const configs = resp?.configs || [];
          if (!configs.length) {
            renderDefaultModels();
            return;
          }
          // 默认选第一条（若当前选中的不在列表中）
          if (!configs.find(c => c.model === selectedModel)) {
            selectedModel = configs[0].model;
            selectedModelLabel = configs[0].name || configs[0].model;
            modelLabel.textContent = selectedModelLabel;
          }
          modelListEl.innerHTML = configs.map(c => {
            const label = c.name || c.model;
            const isSelected = c.model === selectedModel;
            return `<div class="model-option${isSelected ? ' selected' : ''}"
                 data-model="${escHtml(c.model)}" data-label="${escHtml(label)}">
              <span>${escHtml(label)}</span>
              ${isSelected ? '<span class="model-option-check">✓</span>' : ''}
            </div>`;
          }).join('');
        } catch {
          renderDefaultModels();
        }
        bindModelOptions();
      }

      function renderDefaultModels() {
        const defaults = [
          { model: 'claude-opus-4-8',       label: 'Opus 4.7' },
          { model: 'claude-sonnet-4-6',     label: 'Sonnet 4.6' },
          { model: 'claude-haiku-4-5-20251001', label: 'Haiku 4.5' },
        ];
        modelListEl.innerHTML = defaults.map(d => `
          <div class="model-option${d.model === selectedModel ? ' selected' : ''}"
               data-model="${d.model}" data-label="${d.label}">
            <span>${d.label}</span>
            ${d.model === selectedModel ? '<span class="model-option-check">✓</span>' : ''}
          </div>`).join('');
        bindModelOptions();
      }

      function bindModelOptions() {
        modelListEl.querySelectorAll('.model-option').forEach(el => {
          el.addEventListener('click', () => {
            selectedModel = el.dataset.model;
            selectedModelLabel = el.dataset.label;
            modelLabel.textContent = selectedModelLabel;
            modelDropdown.classList.remove('open');
            // 更新选中样式
            modelListEl.querySelectorAll('.model-option').forEach(o => {
              o.classList.remove('selected');
              o.querySelector('.model-option-check')?.remove();
            });
            el.classList.add('selected');
            el.insertAdjacentHTML('beforeend', '<span class="model-option-check">✓</span>');
          });
        });
      }

      modelBtn.addEventListener('click', e => {
        e.stopPropagation();
        const isOpen = modelDropdown.classList.toggle('open');
        if (isOpen) loadModels();
      });
      document.addEventListener('click', () => modelDropdown.classList.remove('open'));
      modelDropdown.addEventListener('click', e => e.stopPropagation());

      // ── API 配置弹窗 ──
      const apiBackdrop  = document.getElementById('api-modal-backdrop');
      const apiClose     = document.getElementById('api-modal-close');
      const apiCancel    = document.getElementById('btn-api-cancel');
      const apiSave      = document.getElementById('btn-api-save');
      const btnTestConn  = document.getElementById('btn-test-conn');
      const testStatus   = document.getElementById('test-status');
      const providerChips= document.getElementById('provider-chips');
      const apiBaseUrl   = document.getElementById('api-base-url');
      const apiKeyInput  = document.getElementById('api-key');
      const apiModelInput= document.getElementById('api-model');
      const keyToggle    = document.getElementById('key-toggle');

      const PROVIDER_DEFAULTS = {
        claude:   { url: 'https://api.anthropic.com', model: 'claude-sonnet-4-6',         placeholder: 'sk-ant-…' },
        openai:   { url: 'https://api.openai.com/v1', model: 'gpt-4o',                    placeholder: 'sk-…' },
        deepseek: { url: 'https://api.deepseek.com',  model: 'deepseek-chat',              placeholder: 'sk-…' },
        kimi:     { url: 'https://api.moonshot.cn/v1',model: 'moonshot-v1-8k',             placeholder: 'sk-…' },
        minimax:  { url: 'https://api.minimax.chat/v1',model: 'abab6.5s-chat',             placeholder: '' },
        doubao:   { url: 'https://ark.cn-beijing.volces.com/api/v3', model: '',            placeholder: '' },
      };

      let currentProvider = 'claude';
      let verifiedOk = false;

      function openApiModal() {
        apiBackdrop.classList.add('open');
        modelDropdown.classList.remove('open');
        resetApiForm();
      }
      function closeApiModal() {
        apiBackdrop.classList.remove('open');
      }

      function resetApiForm() {
        currentProvider = 'claude';
        verifiedOk = false;
        providerChips.querySelectorAll('.provider-chip').forEach(c => {
          c.classList.toggle('active', c.dataset.provider === 'claude');
        });
        const d = PROVIDER_DEFAULTS['claude'];
        apiBaseUrl.value = '';
        apiBaseUrl.placeholder = d.url;
        apiKeyInput.value = '';
        apiKeyInput.placeholder = d.placeholder;
        apiModelInput.value = d.model;
        testStatus.textContent = '';
        testStatus.className = 'test-status';
        apiSave.disabled = true;
      }

      providerChips.addEventListener('click', e => {
        const chip = e.target.closest('.provider-chip');
        if (!chip) return;
        currentProvider = chip.dataset.provider;
        providerChips.querySelectorAll('.provider-chip').forEach(c =>
          c.classList.toggle('active', c === chip));
        const d = PROVIDER_DEFAULTS[currentProvider] || {};
        apiBaseUrl.placeholder = d.url || '';
        apiKeyInput.placeholder = d.placeholder || '';
        apiModelInput.value = d.model || '';
        verifiedOk = false;
        testStatus.textContent = '';
        apiSave.disabled = true;
      });

      // Key 显示/隐藏
      keyToggle.addEventListener('click', () => {
        const show = apiKeyInput.type === 'password';
        apiKeyInput.type = show ? 'text' : 'password';
        keyToggle.textContent = show ? '隐藏' : '显示';
      });

      // 验证连接
      btnTestConn.addEventListener('click', async () => {
        const key = apiKeyInput.value.trim();
        const model = apiModelInput.value.trim();
        if (!key || !model) {
          testStatus.textContent = '请填写 API Key 和模型标识';
          testStatus.className = 'test-status fail';
          return;
        }
        btnTestConn.classList.add('testing');
        btnTestConn.textContent = '验证中…';
        testStatus.textContent = '';
        verifiedOk = false;
        apiSave.disabled = true;

        try {
          // 先临时保存再验证
          const body = {
            provider: currentProvider,
            api_key: key,
            base_url: apiBaseUrl.value.trim() || null,
            model,
          };
          const addResp = await fetch('/api/configs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          }).then(r => r.json());

          if (!addResp?.config?.id) throw new Error('保存失败');
          const configId = addResp.config.id;

          // 验证
          const checkResp = await fetch(`/api/configs/${configId}/check`).then(r => r.json());
          if (checkResp?.valid) {
            verifiedOk = true;
            testStatus.textContent = '✓ 验证通过';
            testStatus.className = 'test-status ok';
            apiSave.disabled = false;
            // 把 configId 存到 save 按钮，直接添加完成
            apiSave.dataset.configId = configId;
          } else {
            // 验证失败，删除刚添加的配置
            await fetch(`/api/configs/${configId}`, { method: 'DELETE' });
            testStatus.textContent = '✗ ' + (checkResp?.message || '验证失败');
            testStatus.className = 'test-status fail';
          }
        } catch (err) {
          testStatus.textContent = '✗ 请求失败，请检查网络';
          testStatus.className = 'test-status fail';
        }

        btnTestConn.classList.remove('testing');
        btnTestConn.textContent = '验证连接';
      });

      // 添加（验证已通过，配置已在后端）
      apiSave.addEventListener('click', async () => {
        if (!verifiedOk) return;
        closeApiModal();
        // 刷新模型列表，自动选中新配置
        const model = apiModelInput.value.trim();
        selectedModel = model;
        selectedModelLabel = model;
        modelLabel.textContent = model;
        await loadModels();
      });

      apiClose.addEventListener('click', async () => {
        // 如果已验证通过但关闭，保留配置（用户可能想之后用）
        closeApiModal();
      });
      apiCancel.addEventListener('click', async () => {
        // 取消时如果有已验证的配置，删除它
        const cid = apiSave.dataset.configId;
        if (cid && !verifiedOk) {
          await fetch(`/api/configs/${cid}`, { method: 'DELETE' }).catch(() => {});
        }
        closeApiModal();
      });
      apiBackdrop.addEventListener('click', e => { if (e.target === apiBackdrop) closeApiModal(); });

      document.getElementById('btn-add-config').addEventListener('click', openApiModal);

      // ── 提炼大纲 ──
      btnDistill.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        if (!name || reqFiles.length === 0) return;

        btnDistill.disabled = true;
        btnDistill.textContent = '创建项目中…';

        try {
          // 1. 创建项目
          const project = await api.projects.create({ name });
          if (!project?.id) throw new Error('创建项目失败');
          createdProjectId = project.id;

          // 2. 上传应标文件（按用户选定的 role 分类上传）
          btnDistill.textContent = '上传文件中…';
          for (const f of reqFiles) {
            await api.materials.upload(project.id, f.file, f.role || 'spec');
          }

          // 3. 跳转到提炼大纲页
          location.href = `/project-init?projectId=${project.id}`;
        } catch (err) {
          console.error(err);
          btnDistill.disabled = false;
          btnDistill.innerHTML = `<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1L8.2 5.3L12.5 6.5L8.2 7.7L7 12L5.8 7.7L1.5 6.5L5.8 5.3L7 1Z" fill="currentColor"/></svg> 提炼大纲`;
        }
